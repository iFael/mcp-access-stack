name: mcp-access-stack-development

x-runtime-security: &runtime-security
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  gateway:
    <<: *runtime-security
    image: mcp-access-stack/gateway:${MCP_IMAGE_TAG:-development}
    build:
      context: ../..
      dockerfile: deploy/docker/gateway.Dockerfile
    env_file:
      - ../../.runtime-private/docker/development/gateway.env
    environment:
      PORT: "4310"
    ports:
      - "127.0.0.1:4310:4310"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4310/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s
    networks:
      - mcp

  proxy:
    <<: *runtime-security
    image: mcp-access-stack/proxy:${MCP_IMAGE_TAG:-development}
    build:
      context: ../..
      dockerfile: deploy/docker/proxy.Dockerfile
    environment:
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: "4300"
      TARGET_HOST: gateway
      TARGET_PORT: "4310"
      MCP_PATH: /mcp-development
    ports:
      - "127.0.0.1:4300:4300"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4300/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
    networks:
      - mcp

  tunnel:
    <<: *runtime-security
    environment:
      NGROK_CONFIG: /var/lib/ngrok/auth-config.yml
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/lib/ngrok:rw,noexec,nosuid,size=1m
    profiles:
      - tunnel
    image: ${NGROK_IMAGE:-ngrok/ngrok:3.30.0-alpine}
    env_file:
      - ../../.runtime-private/docker/development/ngrok.env
    command:
      - http
      - proxy:4300
      - --log=stdout
      - --url=${NGROK_DEVELOPMENT_URL:-}
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      - mcp

networks:
  mcp:
    driver: bridge
