version: 2
updates:
  - package-ecosystem: npm
    directory: /mcp-access-stack
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /mcp-access-stack/deploy/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
