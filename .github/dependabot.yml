version: 2
updates:
  - package-ecosystem: npm
    directory: /mcp-access-stack
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      runtime-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-tooling-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /mcp-access-stack/deploy/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      docker-base-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
