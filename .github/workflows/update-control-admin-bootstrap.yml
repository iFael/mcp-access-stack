name: Update Control admin bootstrap

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: "UUID for this exact first-admin bootstrap intent."
        required: true
        type: string
      confirm_bootstrap:
        description: "Diagnose or explicitly open the short first-admin enrollment window."
        required: true
        type: choice
        default: "NO"
        options:
          - "NO"
          - "DIAGNOSE_STATUS"
          - "BOOTSTRAP_UPDATE_CONTROL_ADMIN"

permissions:
  contents: read

concurrency:
  group: update-control-production
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_bootstrap == 'DIAGNOSE_STATUS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: update-control-production
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Diagnose bootstrap status
        env:
          UPDATE_CONTROL_ADMIN_BOOTSTRAP_OPERATION_ID: ${{ inputs.operation_id }}
          MCP_UPDATE_CONTROL_PUBLIC_URL: ${{ vars.MCP_UPDATE_CONTROL_PUBLIC_URL }}
          UPDATE_CONTROL_ADMIN_HMAC_KEY: ${{ secrets.UPDATE_CONTROL_ADMIN_HMAC_KEY }}
        run: node tooling/update-control-admin-bootstrap.mjs diagnose

  bootstrap:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_bootstrap == 'BOOTSTRAP_UPDATE_CONTROL_ADMIN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: update-control-production
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Open first-admin enrollment window
        env:
          UPDATE_CONTROL_ADMIN_BOOTSTRAP_CONFIRM: ${{ inputs.confirm_bootstrap }}
          UPDATE_CONTROL_ADMIN_BOOTSTRAP_OPERATION_ID: ${{ inputs.operation_id }}
          MCP_UPDATE_CONTROL_PUBLIC_URL: ${{ vars.MCP_UPDATE_CONTROL_PUBLIC_URL }}
          UPDATE_CONTROL_ADMIN_HMAC_KEY: ${{ secrets.UPDATE_CONTROL_ADMIN_HMAC_KEY }}
        run: node tooling/update-control-admin-bootstrap.mjs activate
