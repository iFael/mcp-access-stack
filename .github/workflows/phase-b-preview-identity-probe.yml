name: Phase B preview identity probe

on:
  push:
    tags:
      - "candidate/r10-phase-b-identity-probe-v4"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: public-release
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: mcp-access-stack
      PROBE_ALIAS: phase-b-identity-probe
    steps:
      - name: Checkout exact probe commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Build Edge protocol package
        run: npm run build --workspace @mcp-access-stack/edge-protocol

      - name: Upload isolated preview version and print version metadata
        shell: bash
        run: |
          set -euo pipefail
          wrangler='node_modules/wrangler/bin/wrangler.js'
          probe_token="$(openssl rand -hex 32)"

          upload_output="$(
            node "$wrangler" versions upload               --cwd .               --config services/mcp-edge-gateway/wrangler.jsonc               --name "$WORKER_NAME"               --preview-alias "$PROBE_ALIAS"               --message "Temporary Phase B identity metadata probe"               --var "MCP_PHASE_B_PROBE_TOKEN:$probe_token"               --var "MCP_EDGE_ENABLED:true"               --var "MCP_EDGE_AUTH_MODE:owner"               --var "MCP_PUBLIC_BASE_URL:https://mcp-access-stack.rafaeldamasio77.workers.dev/"               --var "MCP_OWNER_OAUTH_SCOPES:workspaces:read"               --var "MCP_OWNER_ACCESS_TOKEN_TTL_SECONDS:3600"               --var "MCP_OWNER_REFRESH_TOKEN_TTL_SECONDS:2592000"               --var "MCP_OWNER_RESOURCE_NAME:Phase B identity probe"
          )"
          printf '%s\n' "$upload_output"

          version_id="$(sed -nE 's/^Worker Version ID: ([0-9a-f-]+)$/\1/p' <<<"$upload_output" | tail -n 1)"
          test -n "$version_id"
          echo "PHASE_B_VERSION_ID=$version_id"

          echo 'PHASE_B_VERSION_METADATA_BEGIN'
          node "$wrangler" versions view "$version_id" --name "$WORKER_NAME" --json
          echo 'PHASE_B_VERSION_METADATA_END'
