name: Phase B preview identity probe

on:
  push:
    tags:
      - "candidate/r10-phase-b-identity-probe-v2"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: public-release
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: mcp-access-stack
      PROBE_ALIAS: phase-b-identity-probe
      PROBE_BASE_URL: https://phase-b-identity-probe-mcp-access-stack.rafaeldamasio77.workers.dev
    steps:
      - name: Checkout exact probe commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Upload isolated preview version and read Rafael identity
        shell: bash
        run: |
          set -euo pipefail
          wrangler='node_modules/wrangler/bin/wrangler.js'
          probe_token="$(openssl rand -hex 32)"

          upload_output="$(
            node "$wrangler" versions upload               --cwd .               --config services/mcp-edge-gateway/wrangler.jsonc               --name "$WORKER_NAME"               --preview-alias "$PROBE_ALIAS"               --message "Temporary Phase B identity probe"               --var "MCP_PHASE_B_PROBE_TOKEN:$probe_token"               --var "MCP_EDGE_ENABLED:true"               --var "MCP_EDGE_AUTH_MODE:owner"               --var "MCP_PUBLIC_BASE_URL:$PROBE_BASE_URL/"               --var "MCP_OWNER_OAUTH_SCOPES:workspaces:read"               --var "MCP_OWNER_ACCESS_TOKEN_TTL_SECONDS:3600"               --var "MCP_OWNER_REFRESH_TOKEN_TTL_SECONDS:2592000"               --var "MCP_OWNER_RESOURCE_NAME:Phase B identity probe"
          )"
          printf '%s\n' "$upload_output"

          identity=''
          for attempt in $(seq 1 30); do
            if identity="$(curl --fail --silent --show-error               -H "Authorization: Bearer $probe_token"               "$PROBE_BASE_URL/_internal/phase-b-identity-probe")"; then
              break
            fi
            sleep 2
          done

          jq -e '.users | length == 1 and .[0].displayName == "Rafael"' <<<"$identity" >/dev/null
          echo 'PHASE_B_PREVIEW_IDENTITY_BEGIN'
          jq '{user: .users[0]}' <<<"$identity"
          echo 'PHASE_B_PREVIEW_IDENTITY_END'
