name: Phase B preview identity probe

on:
  push:
    tags:
      - "candidate/r10-phase-b-identity-probe-v5"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: public-release
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: mcp-access-stack
      PREVIEW_NAME: r10-homologation
    steps:
      - name: Checkout exact probe commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Build Edge protocol
        run: npm run build --workspace @mcp-access-stack/edge-protocol

      - name: Read Rafael identity from existing R10 Preview
        shell: bash
        run: |
          set -euo pipefail
          result_file="$RUNNER_TEMP/phase-b-preview.json"
          sanitize_file="$RUNNER_TEMP/phase-b-preview-sanitize.json"
          probe_token="$(openssl rand -hex 32)"
          sanitized=false

          sanitize_preview() {
            if [[ "$sanitized" == "true" ]]; then
              return 0
            fi
            npx wrangler preview               --cwd .               --config services/mcp-edge-gateway/wrangler.jsonc               --name "$PREVIEW_NAME"               --worker-name "$WORKER_NAME"               --tag "phase-b-sanitize-$GITHUB_RUN_ID"               --message "Restore R10 Preview after Phase B identity probe"               --ignore-base-config               --json > "$sanitize_file"
            sanitized=true
          }
          trap sanitize_preview EXIT

          npx wrangler preview             --cwd .             --config services/mcp-edge-gateway/wrangler.jsonc             --name "$PREVIEW_NAME"             --worker-name "$WORKER_NAME"             --tag "phase-b-probe-$GITHUB_RUN_ID"             --message "Temporary Phase B identity probe"             --ignore-base-config             --var "MCP_PHASE_B_PROBE_TOKEN:$probe_token"             --json > "$result_file"

          preview_url="$(jq -er '.preview.urls[0] // .preview_urls[0] // .result.preview_urls[0] // empty' "$result_file")"
          preview_url="${preview_url%/}"

          identity=''
          for attempt in $(seq 1 20); do
            if identity="$(curl --fail --silent --show-error               -H "Authorization: Bearer $probe_token"               "$preview_url/_internal/phase-b-identity-probe")"; then
              break
            fi
            sleep 2
          done

          jq -e '.users | length == 1 and .[0].displayName == "Rafael"' <<<"$identity" >/dev/null
          echo 'PHASE_B_PREVIEW_IDENTITY_BEGIN'
          jq '{user: .users[0]}' <<<"$identity"
          echo 'PHASE_B_PREVIEW_IDENTITY_END'

          sanitize_preview
          trap - EXIT

      - name: Remove non-routable probe versions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$WORKER_NAME/versions"
          for version_id in             488baee8-abb7-4a04-b3aa-e9405b79268d             74c0e982-6738-4333-ac12-4a24a95cd772
          do
            code="$(curl --silent --show-error               --output /dev/null               --write-out '%{http_code}'               -X DELETE               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "$api/$version_id" || true)"
            case "$code" in
              200|204|404) echo "probe version cleanup: $version_id -> HTTP $code" ;;
              *) echo "probe version cleanup warning: $version_id -> HTTP $code" >&2 ;;
            esac
          done
