name: Windows companion-only checksummed distribution

# github_workflow_operation finds its own dispatch only by mcp-companion-publish-<operation_id>.
run-name: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation_id != '' && format('mcp-companion-publish-{0}', inputs.operation_id) || format('publish companion CI-{0} @ {1}', inputs.ci_run_id, inputs.expected_sha)) || format('companion CI-{0} @ {1}', github.event.workflow_run.id, github.event.workflow_run.head_sha) }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA with canonical green CI
        required: true
        type: string
      ci_run_id:
        description: Exact successful main CI run that produced the checksummed companion artifact
        required: true
        type: string
      operation_id:
        description: Optional MCP operation UUID; empty for a manual run
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: companion-only-ci-${{ github.event.workflow_run.id || inputs.ci_run_id }}
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
      release-id: ${{ steps.verify.outputs.release-id }}
      canonical-ci-run: ${{ steps.verify.outputs.canonical-ci-run }}
    steps:
      - name: Checkout the exact successful main CI commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify successful upstream CI, main CAS and immutable identity
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          ci_evidence="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" \
            --jq '{head_sha,head_branch,event,status,conclusion,repository: .repository.full_name}')"
          jq -e --arg sha "$EXPECTED_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.head_sha == $sha and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success" and .repository == $repo' \
            <<< "$ci_evidence" > /dev/null
          remote_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$remote_main" == "$EXPECTED_SHA" ]]

          # Latest reachable public tag, never root private package.json.
          reachable_tags="$(git tag --merged "$EXPECTED_SHA" --list 'v[0-9]*' --sort=-version:refname)"
          base_tag="${reachable_tags%%$'\n'*}"
          [[ "$base_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)([-.][0-9A-Za-z.-]+)?$ ]]
          release_id="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-companion.$CI_RUN_ID"

          # Re-delivery of the same CI cannot silently publish a duplicate artifact.
          prior_runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow companion-only-distribution.yml --event workflow_run \
            --limit 100 \
            --json databaseId,displayTitle,status,conclusion)"
          [[ "$(jq 'length' <<< "$prior_runs")" -lt 100 ]] || {
            echo "Distribution history exceeds bounded duplicate precheck." >&2
            exit 1
          }
          # A previous skipped/failed run without artifacts is not a publication.
          # Still reject live runs, successful runs, or any previously uploaded artifact.
          matching_runs="$(jq -c --arg title "companion CI-$CI_RUN_ID @ $EXPECTED_SHA" \
            --argjson current "$GITHUB_RUN_ID" \
            '.[] | select(.displayTitle == $title and .databaseId != $current)' <<< "$prior_runs")"
          while IFS= read -r prior; do
            [[ -n "$prior" ]] || continue
            prior_id="$(jq -r '.databaseId' <<< "$prior")"
            prior_status="$(jq -r '.status' <<< "$prior")"
            prior_conclusion="$(jq -r '.conclusion' <<< "$prior")"
            [[ "$prior_id" =~ ^[1-9][0-9]*$ ]] || exit 1
            if [[ "$prior_status" != "completed" || "$prior_conclusion" == "success" ]]; then
              echo "A companion distribution already exists or is running for this CI run." >&2
              exit 1
            fi
            prior_artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$prior_id/artifacts" --jq '.total_count')"
            if [[ "$prior_artifacts" != "0" ]]; then
              echo "A companion distribution already uploaded artifacts for this CI run." >&2
              exit 1
            fi
          done <<< "$matching_runs"
          echo "commit=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"
          echo "canonical-ci-run=$CI_RUN_ID" >> "$GITHUB_OUTPUT"

  windows-companion:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 45
    environment: public-release
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exactly verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pin repository identity again before package build
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.commit }}
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SHA) {
            throw 'Package checkout does not match preflight commit.'
          }

      - name: Set up Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Build immutable Windows runtime
        run: npm run build

      - name: Build immutable release without any install or cutover
        env:
          RELEASE_ID: ${{ needs.preflight.outputs.release-id }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.commit }}
          CI_RUN_ID: ${{ needs.preflight.outputs.canonical-ci-run }}
        run: |
          & ./deploy/windows/New-McpRelease.ps1 `
            -ReleaseId $env:RELEASE_ID `
            -SourceCommit $env:SOURCE_COMMIT `
            -BuildRunId ([long]$env:CI_RUN_ID) `
            -OutputDirectory (Join-Path $PWD "releases/$env:RELEASE_ID")

      - name: Build native Windows execution-node artifacts
        env:
          RELEASE_ID: ${{ needs.preflight.outputs.release-id }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          & ./deploy/windows/New-McpWindowsExecutionNodeArtifacts.ps1 `
            -ReleaseId $env:RELEASE_ID `
            -SourceCommit $env:SOURCE_COMMIT `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'companion-native')

      - name: Assemble checksummed local Windows distribution only
        env:
          RELEASE_ID: ${{ needs.preflight.outputs.release-id }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          $edgeMatch = [regex]::Match(
            (Get-Content services/mcp-edge-gateway/wrangler.jsonc -Raw),
            '"MCP_PUBLIC_BASE_URL"\s*:\s*"([^"]+)"'
          )
          if (-not $edgeMatch.Success) { throw 'Pinned Edge origin is absent.' }
          $edgeBase = $edgeMatch.Groups[1].Value
          if ($edgeBase -notmatch '^https://[^/?#]+/$') { throw 'Invalid credential-free Edge origin.' }
          & ./deploy/windows/New-McpPublicDistribution.ps1 `
            -ReleaseId $env:RELEASE_ID `
            -SourceCommit $env:SOURCE_COMMIT `
            -ReleaseTag "v$env:RELEASE_ID" `
            -BuildRunId ([long]$env:GITHUB_RUN_ID) `
            -WorkflowName 'Companion-only distribution' `
            -ExecutionNodeNativeDirectory (Join-Path $env:RUNNER_TEMP 'companion-native') `
            -EdgeBaseUrl $edgeBase `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'companion-distribution')

      - name: Verify SHA-256 manifests and execution-node runtime smoke
        env:
          RELEASE_ID: ${{ needs.preflight.outputs.release-id }}
        run: |
          & ./deploy/windows/Test-McpWindowsExecutionNodePackage.ps1 `
            -ReleaseRoot (Join-Path $env:RUNNER_TEMP "companion-distribution/stage/releases/$env:RELEASE_ID") `

      - name: Verify companion artifact checksum before publishing build artifact
        env:
          RELEASE_ID: ${{ needs.preflight.outputs.release-id }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'companion-distribution'
          $name = "v$env:RELEASE_ID-windows-x64.zip"
          $zip = Join-Path $dir $name
          $sum = Join-Path $dir "$name.sha256"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf) -or
              -not (Test-Path -LiteralPath $sum -PathType Leaf)) { throw 'ZIP or SHA-256 is missing.' }
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = (Get-Content -LiteralPath $sum -Raw).Trim() -split '\s+'
          if ($expected.Length -ne 2 -or $expected[0] -cne $actual -or $expected[1] -cne "*$name") {
            throw 'Companion distribution checksum mismatch.'
          }

      - name: Recheck main CAS before making the checksummed artifact available
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.commit }}
        run: |
          $remoteMain = (& gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha').Trim()
          if ($LASTEXITCODE -ne 0 -or $remoteMain -cne $env:EXPECTED_SHA) {
            throw 'main advanced while packaging; refuse to publish a stale distribution.'
          }

      - name: Upload checksummed companion distribution without publishing a GitHub Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-companion-${{ needs.preflight.outputs.release-id }}-${{ needs.preflight.outputs.commit }}
          path: |
            ${{ runner.temp }}/companion-distribution/v${{ needs.preflight.outputs.release-id }}-windows-x64.zip
            ${{ runner.temp }}/companion-distribution/v${{ needs.preflight.outputs.release-id }}-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish-companion:
    # Explicit approved gate reuses the already checksummed artifact.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: public-release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact authorized main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26

      - name: Verify canonical CI and checksummed artifact, then publish once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ -z "$OPERATION_ID" || "$OPERATION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          observed_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$observed_main" == "$EXPECTED_SHA" ]]
          ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq '{head_sha,head_branch,event,status,conclusion,repository:.repository.full_name}')"
          jq -e --arg sha "$EXPECTED_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.head_sha == $sha and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success" and .repository == $repo' <<< "$ci" >/dev/null
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow companion-only-distribution.yml \
            --event workflow_run --limit 100 --json databaseId,displayTitle,status,conclusion,headSha)"
          [[ "$(jq 'length' <<< "$runs")" -lt 100 ]]
          ids="$(jq -r --arg title "companion CI-$CI_RUN_ID @ $EXPECTED_SHA" --arg sha "$EXPECTED_SHA" \
            '[.[] | select(.displayTitle == $title and .headSha == $sha and .status == "completed" and .conclusion == "success") | .databaseId] | .[]' <<< "$runs")"
          [[ "$(wc -l <<< "$ids")" == "1" ]]
          [[ "$ids" =~ ^[1-9][0-9]*$ ]]
          base="$(git tag --merged "$EXPECTED_SHA" --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          [[ "$base" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)([-.][0-9A-Za-z.-]+)?$ ]]
          release_id="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-companion.$CI_RUN_ID"
          release_tag="v$release_id"
          artifact="windows-companion-$release_id-$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/companion-publish"
          gh run download "$ids" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$RUNNER_TEMP/companion-publish"
          cd "$RUNNER_TEMP/companion-publish"
          archive="$release_tag-windows-x64.zip"
          test -s "$archive"
          test -s "$archive.sha256"
          sha256sum --check --status "$archive.sha256"
          cd "$GITHUB_WORKSPACE"
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$EXPECTED_SHA" ]]
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json id >/dev/null 2>&1; then
            echo 'COMPANION_RELEASE_ALREADY_PUBLISHED: reconcile, never republish' >&2
            exit 1
          fi
          export RELEASE_TAG="$release_tag"
          node tooling/release/bootstrap-release-tag.mjs
          gh release create "$release_tag" \
            "$RUNNER_TEMP/companion-publish/$archive" \
            "$RUNNER_TEMP/companion-publish/$archive.sha256" \
            --verify-tag --prerelease --repo "$GITHUB_REPOSITORY" \
            --title "$release_tag (Windows companion only)" \
            --notes "Checksummed Windows companion artifact from successful main CI $CI_RUN_ID. No Edge, Oracle, or runtime deployment."
