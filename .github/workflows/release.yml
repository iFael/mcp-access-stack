name: Public release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  signing-preflight:
    runs-on: ubuntu-latest
    environment: public-release
    steps:
      - name: Require release secrets before publishing anything
        shell: bash
        env:
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          MACOS_APPLICATION_SIGNING_IDENTITY: ${{ secrets.MACOS_APPLICATION_SIGNING_IDENTITY }}
          MACOS_INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_PFX"
          test -n "$SIGNING_PASSWORD"
          test -n "$MACOS_SIGNING_P12"
          test -n "$MACOS_SIGNING_PASSWORD"
          test -n "$MACOS_APPLICATION_SIGNING_IDENTITY"
          test -n "$MACOS_INSTALLER_SIGNING_IDENTITY"
          test -n "$MACOS_NOTARY_APPLE_ID"
          test -n "$MACOS_NOTARY_TEAM_ID"
          test -n "$MACOS_NOTARY_PASSWORD"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

  metadata:
    needs: signing-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      edge-base-url: ${{ steps.meta.outputs.edge-base-url }}
      ci-run-id: ${{ steps.ci.outputs.run-id }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable release identity
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$TAG_INPUT"
          else
            tag="$REF_NAME"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          version="${tag#v}"
          commit="$(git rev-parse HEAD)"
          test "$(git rev-parse "$tag^{commit}")" = "$commit"
          edge_base_url="$(sed -nE 's/.*"MCP_PUBLIC_BASE_URL"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' services/mcp-edge-gateway/wrangler.jsonc | head -n 1)"
          [[ "$edge_base_url" =~ ^https://[^/?#]+/$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "edge-base-url=$edge_base_url" >> "$GITHUB_OUTPUT"

      - name: Require successful canonical main CI for exact release commit
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          run_id="$(
            gh run list \
              --repo "$REPOSITORY" \
              --workflow CI \
              --branch main \
              --commit "$SOURCE_COMMIT" \
              --event push \
              --status success \
              --limit 10 \
              --json databaseId \
              --jq 'sort_by(.databaseId) | last | .databaseId // empty'
          )"
          test -n "$run_id"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

  package:
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 30
    environment: public-release
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: .
        shell: pwsh
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js bootstrap
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows runtime
        run: npm run build

      - name: Build immutable Windows release
        env:
          RELEASE_ID: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.commit }}
          CI_RUN_ID: ${{ needs.metadata.outputs.ci-run-id }}
        run: |
          pwsh -NoLogo -NoProfile -File deploy/windows/New-McpRelease.ps1 `
            -ReleaseId $env:RELEASE_ID `
            -SourceCommit $env:SOURCE_COMMIT `
            -BuildRunId ([long]$env:CI_RUN_ID) `
            -OutputDirectory (Join-Path $PWD "releases\$env:RELEASE_ID")

      - name: Build Windows execution-node native artifacts
        env:
          RELEASE_ID: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          pwsh -NoLogo -NoProfile -File deploy/windows/New-McpWindowsExecutionNodeArtifacts.ps1 `
            -ReleaseId $env:RELEASE_ID `
            -SourceCommit $env:SOURCE_COMMIT `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'execution-node-native')

      - name: Assemble and sign minimal public distribution
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          RELEASE_ID: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.commit }}
          EDGE_BASE_URL: ${{ needs.metadata.outputs.edge-base-url }}
        run: |
          pwsh -NoLogo -NoProfile -File deploy/windows/New-McpPublicDistribution.ps1 `
            -ReleaseId $env:RELEASE_ID `
            -SourceCommit $env:SOURCE_COMMIT `
            -ReleaseTag $env:RELEASE_TAG `
            -BuildRunId ([long]$env:GITHUB_RUN_ID) `
            -ExecutionNodeNativeDirectory (Join-Path $env:RUNNER_TEMP 'execution-node-native') `
            -EdgeBaseUrl $env:EDGE_BASE_URL `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'public-distribution')

      - name: Validate signed Windows execution-node package
        timeout-minutes: 5
        env:
          RELEASE_ID: ${{ needs.metadata.outputs.version }}
        run: |
          pwsh -NoLogo -NoProfile -File deploy/windows/Test-McpWindowsExecutionNodePackage.ps1 `
            -ReleaseRoot (Join-Path $env:RUNNER_TEMP "public-distribution\stage\releases\$env:RELEASE_ID") `
            -OfflinePinnedAuthenticode

      - name: Upload signed release assets for publisher job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-release-assets-${{ needs.metadata.outputs.version }}
          path: |
            ${{ runner.temp }}/public-distribution/${{ needs.metadata.outputs.tag }}-windows-x64.zip
            ${{ runner.temp }}/public-distribution/${{ needs.metadata.outputs.tag }}-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 1

  unix-packages:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: ubuntu-24.04-arm
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: macos-15-intel
            platform: darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    environment: public-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js bootstrap
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare macOS signing keychain
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          MACOS_APPLICATION_SIGNING_IDENTITY: ${{ secrets.MACOS_APPLICATION_SIGNING_IDENTITY }}
          MACOS_INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/mcp-v3-signing.keychain-db"
          p12="$RUNNER_TEMP/mcp-v3-signing.p12"
          keychain_password="$(uuidgen)"
          printf '%s' "$MACOS_SIGNING_P12_BASE64" | /usr/bin/base64 -D > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/pkgbuild
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$MACOS_APPLICATION_SIGNING_IDENTITY"
          security find-certificate -c "$MACOS_INSTALLER_SIGNING_IDENTITY" "$keychain" >/dev/null
          rm -f "$p12"
          echo "MCP_V3_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build Unix local companion graph
        run: |
          set -euo pipefail
          npm run build --workspace @vs-code-gpt/shared
          npm run build --workspace @mcp-access-stack/edge-protocol
          npm run build --workspace @vs-code-gpt/local-agent
          npm run build --workspace @vs-code-gpt/remote-mcp-gateway

      - name: Build immutable Unix local package
        env:
          RELEASE_ID: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.commit }}
          CI_RUN_ID: ${{ needs.metadata.outputs.ci-run-id }}
          EDGE_BASE_URL: ${{ needs.metadata.outputs.edge-base-url }}
          MACOS_APPLICATION_SIGNING_IDENTITY: ${{ secrets.MACOS_APPLICATION_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            extra+=(--macos-code-sign-identity "$MACOS_APPLICATION_SIGNING_IDENTITY")
          fi
          node tooling/release/New-McpV3LocalPackage.mjs \
            --release-id "$RELEASE_ID" \
            --source-commit "$SOURCE_COMMIT" \
            --edge-base-url "$EDGE_BASE_URL" \
            --build-run-id "$CI_RUN_ID" \
            --output "$RUNNER_TEMP/mcp-v3-local-package" \
            "${extra[@]}"

      - name: Validate Unix local lifecycle
        env:
          EDGE_BASE_URL: ${{ needs.metadata.outputs.edge-base-url }}
        run: |
          set -euo pipefail
          bash deploy/unix/Test-McpV3LocalLifecycle.sh \
            --package-root "$RUNNER_TEMP/mcp-v3-local-package" \
            --expected-edge "$EDGE_BASE_URL"

      - name: Build Linux native package
        if: runner.os == 'Linux'
        id: deb
        env:
          RELEASE_ID: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          arch="$(node -p 'process.arch')"
          case "$arch" in
            x64) deb_arch=amd64 ;;
            arm64) deb_arch=arm64 ;;
            *) echo "Unsupported Debian architecture: $arch" >&2; exit 1 ;;
          esac
          deb_asset="$RELEASE_TAG-linux-$deb_arch.deb"
          node tooling/release/New-McpV3LinuxDeb.mjs \
            --package-root "$RUNNER_TEMP/mcp-v3-local-package" \
            --release-id "$RELEASE_ID" \
            --output "$RUNNER_TEMP/$deb_asset"
          dpkg-deb --info "$RUNNER_TEMP/$deb_asset"
          dpkg-deb --contents "$RUNNER_TEMP/$deb_asset" | grep -E '^-rw-r--r-- .*\./usr/share/applications/mcp-v3\.desktop$'
          (
            cd "$RUNNER_TEMP"
            sha256sum "$deb_asset" > "$deb_asset.sha256"
          )
          echo "deb_asset=$deb_asset" >> "$GITHUB_OUTPUT"
          echo "deb_arch=$deb_arch" >> "$GITHUB_OUTPUT"

      - name: Build, sign and notarize macOS native package
        if: runner.os == 'macOS'
        id: macpkg
        env:
          RELEASE_ID: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          MACOS_INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          arch="$(node -p 'process.arch')"
          pkg_asset="$RELEASE_TAG-darwin-$arch.pkg"
          pkg_path="$RUNNER_TEMP/$pkg_asset"
          node tooling/release/New-McpV3MacPkg.mjs \
            --package-root "$RUNNER_TEMP/mcp-v3-local-package" \
            --release-id "$RELEASE_ID" \
            --sign-identity "$MACOS_INSTALLER_SIGNING_IDENTITY" \
            --output "$pkg_path"
          pkgutil --check-signature "$pkg_path"
          xcrun notarytool submit "$pkg_path" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple "$pkg_path"
          xcrun stapler validate "$pkg_path"
          spctl --assess --type install --verbose=4 "$pkg_path"
          node - "$pkg_path" "$pkg_path.sha256" "$pkg_asset" <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const [input, output, name] = process.argv.slice(2);
          const digest = crypto.createHash("sha256").update(fs.readFileSync(input)).digest("hex");
          fs.writeFileSync(output, digest + "  " + name + "\n", "utf8");
          NODE
          echo "pkg_asset=$pkg_asset" >> "$GITHUB_OUTPUT"
          echo "mac_arch=$arch" >> "$GITHUB_OUTPUT"

      - name: Archive and checksum Unix local package
        id: asset
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          platform="$(node -p 'process.platform')"
          arch="$(node -p 'process.arch')"
          test "$platform" = "$EXPECTED_PLATFORM"
          asset="$RELEASE_TAG-$platform-$arch.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" mcp-v3-local-package
          node - "$RUNNER_TEMP/$asset" "$RUNNER_TEMP/$asset.sha256" "$asset" <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const [input, output, name] = process.argv.slice(2);
          const digest = crypto.createHash("sha256").update(fs.readFileSync(input)).digest("hex");
          fs.writeFileSync(output, digest + "  " + name + "\n", "utf8");
          NODE
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"

      - name: Attest Unix package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/${{ steps.asset.outputs.asset }}

      - name: Attest Linux native package provenance
        if: runner.os == 'Linux'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/${{ steps.deb.outputs.deb_asset }}

      - name: Attest macOS native package provenance
        if: runner.os == 'macOS'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/${{ steps.macpkg.outputs.pkg_asset }}

      - name: Upload Linux native package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-deb-${{ steps.deb.outputs.deb_arch }}
          path: |
            ${{ runner.temp }}/${{ steps.deb.outputs.deb_asset }}
            ${{ runner.temp }}/${{ steps.deb.outputs.deb_asset }}.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Upload macOS native package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-pkg-${{ steps.macpkg.outputs.mac_arch }}
          path: |
            ${{ runner.temp }}/${{ steps.macpkg.outputs.pkg_asset }}
            ${{ runner.temp }}/${{ steps.macpkg.outputs.pkg_asset }}.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Upload Unix release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unix-local-${{ steps.asset.outputs.platform }}-${{ steps.asset.outputs.arch }}
          path: |
            ${{ runner.temp }}/${{ steps.asset.outputs.asset }}
            ${{ runner.temp }}/${{ steps.asset.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Remove macOS signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          set +e
          if [[ -n "${MCP_V3_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$MCP_V3_SIGNING_KEYCHAIN"
          fi

  edge:
    needs:
      - metadata
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: public-release
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js bootstrap
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve expected Edge contract revision
        id: edge-contract
        run: |
          set -euo pipefail
          expected="$(node -e 'const fs=require("node:fs"); const source=fs.readFileSync("services/mcp-edge-gateway/src/generated/mcp-tool-manifest.ts","utf8"); const match=source.match(/"contractRevision": "([0-9a-f]{64})"/); if(!match) process.exit(1); process.stdout.write(match[1]);')"
          test -n "$expected"
          echo "revision=$expected" >> "$GITHUB_OUTPUT"

      - name: Preflight contract rollout compatibility
        env:
          EXPECTED_CONTRACT_REVISION: ${{ steps.edge-contract.outputs.revision }}
          EDGE_BASE_URL: ${{ needs.metadata.outputs.edge-base-url }}
        run: |
          set -euo pipefail
          EDGE_HEALTH_URL="${EDGE_BASE_URL%/}/health"
          current_health="$(curl --fail --silent --show-error "$EDGE_HEALTH_URL")"
          service="$(jq -r '.service // empty' <<<"$current_health")"
          current_expected="$(jq -r '.expectedContractRevision // empty' <<<"$current_health")"
          active_revision="$(jq -r '.activeContractRevision // empty' <<<"$current_health")"
          candidate_revision="$(jq -r '.candidateContractRevision // empty' <<<"$current_health")"
          if [[ "$service" != "mcp-edge-gateway" || -z "$current_expected" ]]; then
            echo "Current Edge health is not a valid rollout authority." >&2
            echo "$current_health" >&2
            exit 1
          fi
          if [[ "$current_expected" != "$EXPECTED_CONTRACT_REVISION" ]]; then
            if [[ -z "$active_revision" || "$active_revision" != "$current_expected" ]]; then
              echo "Contract-changing release requires rollout infrastructure from the previous stable Edge before deploy." >&2
              echo "currentExpected=$current_expected active=$active_revision next=$EXPECTED_CONTRACT_REVISION" >&2
              exit 1
            fi
            if [[ -n "$candidate_revision" ]]; then
              echo "Contract-changing release refused because another candidate contract is still prepared: $candidate_revision" >&2
              exit 1
            fi
          fi
          echo "Edge rollout preflight passed: current=$current_expected active=$active_revision next=$EXPECTED_CONTRACT_REVISION"

      - name: Prepare exact Edge contract in production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace @mcp-access-stack/edge-gateway

      - name: Verify prepared Edge contract before publication
        env:
          EXPECTED_CONTRACT_REVISION: ${{ steps.edge-contract.outputs.revision }}
          EDGE_BASE_URL: ${{ needs.metadata.outputs.edge-base-url }}
        run: |
          set -euo pipefail
          EDGE_HEALTH_URL="${EDGE_BASE_URL%/}/health"
          last_health=''
          for attempt in $(seq 1 12); do
            if last_health="$(curl --fail --silent --show-error "$EDGE_HEALTH_URL")"; then
              actual_revision="$(jq -r '.expectedContractRevision // empty' <<<"$last_health")"
              active_revision="$(jq -r '.activeContractRevision // empty' <<<"$last_health")"
              candidate_revision="$(jq -r '.candidateContractRevision // empty' <<<"$last_health")"
              control_plane_ready="$(jq -r '.controlPlaneReady // false' <<<"$last_health")"
              execution_plane_ready="$(jq -r '.executionPlaneReady // false' <<<"$last_health")"
              connector_ready="$(jq -r '.connectorReady // false' <<<"$last_health")"
              contract_compatible="$(jq -r '.contractCompatible // false' <<<"$last_health")"
              service="$(jq -r '.service // empty' <<<"$last_health")"
              rollout_ready=false
              if [[ "$active_revision" == "$EXPECTED_CONTRACT_REVISION" || "$candidate_revision" == "$EXPECTED_CONTRACT_REVISION" ]]; then
                rollout_ready=true
              fi
              connected_runtime_safe=true
              if [[ "$connector_ready" == "true" && ( "$contract_compatible" != "true" || "$execution_plane_ready" != "true" ) ]]; then
                connected_runtime_safe=false
              fi
              if [[ "$service" == "mcp-edge-gateway" && "$actual_revision" == "$EXPECTED_CONTRACT_REVISION" && "$control_plane_ready" == "true" && "$rollout_ready" == "true" && "$connected_runtime_safe" == "true" ]]; then
                echo "Edge contract prepared: expected=$actual_revision active=$active_revision candidate=$candidate_revision"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Edge contract prepare verification failed. Expected: $EXPECTED_CONTRACT_REVISION" >&2
          echo "$last_health" >&2
          exit 1

  publish:
    needs:
      - metadata
      - package
      - unix-packages
      - edge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: public-release-assets-${{ needs.metadata.outputs.version }}
          path: release-assets

      - name: Download Unix release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: unix-local-*
          path: release-assets
          merge-multiple: true

      - name: Download Linux native packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: linux-deb-*
          path: release-assets
          merge-multiple: true

      - name: Download macOS native packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: macos-pkg-*
          path: release-assets
          merge-multiple: true

      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          args=(release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}" --repo "$GITHUB_REPOSITORY"
