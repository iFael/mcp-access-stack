name: Stage current Edge CAS candidate (no traffic)

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact main SHA with successful CI
        required: true
        type: string
      expected_active_deployment_id:
        description: Pinned active deployment UUID for 100% traffic
        required: true
        type: string
      expected_active_version_id:
        description: Pinned immutable active Worker version UUID
        required: true
        type: string
      expected_contract_revision:
        description: Full catalog contract revision embedded in pinned main
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: public-release-edge
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require pinned main, valid CAS and successful CI before Cloudflare credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_ACTIVE_DEPLOYMENT_ID: ${{ inputs.expected_active_deployment_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ inputs.expected_active_version_id }}
          EXPECTED_CONTRACT_REVISION: ${{ inputs.expected_contract_revision }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "iFael/mcp-access-stack" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_ACTIVE_DEPLOYMENT_ID" =~ ^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$ ]]
          [[ "$EXPECTED_ACTIVE_VERSION_ID" =~ ^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$ ]]
          [[ "$EXPECTED_CONTRACT_REVISION" =~ ^[a-f0-9]{64}$ ]]
          [[ "$(gh api repos/iFael/mcp-access-stack/git/ref/heads/main --jq '.object.sha')" == "$EXPECTED_MAIN_SHA" ]]
          ci_count="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch main \
            --commit "$EXPECTED_MAIN_SHA" --event push --status success --limit 20 \
            --json headSha,status,conclusion,databaseId \
            --jq '[.[] | select(.headSha == env.EXPECTED_MAIN_SHA and .status == "completed" and .conclusion == "success")] | length')"
          [[ "$ci_count" =~ ^[1-9][0-9]*$ ]]

  stage:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: public-release
    permissions:
      contents: read
    steps:
      - name: Checkout pinned main without persisted GitHub credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_main_sha }}
          persist-credentials: false

      - name: Setup pinned Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Reconcile main after protected Environment approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$(gh api repos/iFael/mcp-access-stack/git/ref/heads/main --jq '.object.sha')" == "$EXPECTED_MAIN_SHA" ]]

      - name: Install pinned dependencies
        run: npm ci

      - name: Build Edge package dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm run build --workspace @mcp-access-stack/edge-protocol
          npm run build --workspace @mcp-access-stack/mcp-owner-auth

      - name: Validate exact CAS candidate source without network
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_ACTIVE_DEPLOYMENT_ID: ${{ inputs.expected_active_deployment_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ inputs.expected_active_version_id }}
          EXPECTED_CONTRACT_REVISION: ${{ inputs.expected_contract_revision }}
        run: |
          set -euo pipefail
          node tooling/release/stage-edge-cas-candidate.mjs preflight
          npx wrangler deploy --cwd . --config services/mcp-edge-gateway/wrangler.jsonc --dry-run \
            --outdir services/mcp-edge-gateway/.wrangler/dry-run

      - name: GET-only Cloudflare CAS and secret prerequisites before upload
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_ACTIVE_DEPLOYMENT_ID: ${{ inputs.expected_active_deployment_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ inputs.expected_active_version_id }}
          EXPECTED_CONTRACT_REVISION: ${{ inputs.expected_contract_revision }}
        run: |
          set -euo pipefail
          node tooling/release/stage-edge-cas-candidate.mjs before

      - name: Upload ONE immutable CAS Worker version without moving traffic
        id: upload
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MCP_CONTRACT_PREPARE_TOKEN: ${{ secrets.MCP_CONTRACT_PREPARE_TOKEN }}
          EXPECTED_ACTIVE_DEPLOYMENT_ID: ${{ inputs.expected_active_deployment_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ inputs.expected_active_version_id }}
          EXPECTED_CONTRACT_REVISION: ${{ inputs.expected_contract_revision }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/edge-cas-candidate-secrets.json"' EXIT
          # The secret exists only in this protected step, not in checkout or artifacts.
          node tooling/release/stage-edge-cas-candidate.mjs secret-file
          unset MCP_CONTRACT_PREPARE_TOKEN
          if ! npx wrangler versions upload --strict --keep-vars \
            --secrets-file "$RUNNER_TEMP/edge-cas-candidate-secrets.json" \
            --config services/mcp-edge-gateway/wrangler.jsonc \
            > "$RUNNER_TEMP/edge-cas-candidate-upload.log" 2>&1; then
            node tooling/release/stage-edge-cas-candidate.mjs diagnose || true
            echo "::error::Upload outcome unknown; do NOT retry. Reconcile Cloudflare version inventory first."
            exit 1
          fi

      - name: Verify immutable version and unchanged active 100-percent deployment
        id: verify
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_ACTIVE_DEPLOYMENT_ID: ${{ inputs.expected_active_deployment_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ inputs.expected_active_version_id }}
          EXPECTED_CONTRACT_REVISION: ${{ inputs.expected_contract_revision }}
        run: |
          set -euo pipefail
          node tooling/release/stage-edge-cas-candidate.mjs after

      - name: Return immutable version ID, NOT a traffic deployment
        if: ${{ steps.verify.outcome == 'success' }}
        env:
          VERSION_ID: ${{ steps.verify.outputs.version_id }}
        run: |
          echo "Staged immutable CAS version: $VERSION_ID. Current production traffic unchanged."
