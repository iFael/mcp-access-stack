name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shared: ${{ steps.impact.outputs.shared }}
      edgeProtocol: ${{ steps.impact.outputs.edgeProtocol }}
      workspaceAgent: ${{ steps.impact.outputs.workspaceAgent }}
      mcpGateway: ${{ steps.impact.outputs.mcpGateway }}
      edgeGateway: ${{ steps.impact.outputs.edgeGateway }}
      browserWorker: ${{ steps.impact.outputs.browserWorker }}
      windowsRuntime: ${{ steps.impact.outputs.windowsRuntime }}
      dockerGateway: ${{ steps.impact.outputs.dockerGateway }}
      dockerBrowser: ${{ steps.impact.outputs.dockerBrowser }}
      dockerProxy: ${{ steps.impact.outputs.dockerProxy }}
      operationsTooling: ${{ steps.impact.outputs.operationsTooling }}
      rootBroad: ${{ steps.impact.outputs.rootBroad }}
      docsOnly: ${{ steps.impact.outputs.docsOnly }}
      resolverFailed: ${{ steps.impact.outputs.resolverFailed }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26

      - name: Resolve changed scope
        id: impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node mcp-access-stack/tooling/ci/resolve-impact.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Report fail-closed resolver fallback
        if: steps.impact.outputs.resolverFailed == 'true'
        shell: bash
        run: echo "Impact resolution failed; CI expanded to broad coverage."

  pr-validation:
    needs: impact
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mcp-access-stack
        shell: pwsh
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp-access-stack/package-lock.json

      - name: Validate impact resolver
        run: node tooling/ci/resolve-impact.test.mjs

      - name: Validate repository structure
        run: node tooling/structure/validate-repository-structure.test.mjs

      - name: Install dependencies
        if: github.event_name == 'pull_request' && (needs.impact.result != 'success' || needs.impact.outputs.docsOnly != 'true')
        run: npm ci


      - name: Validate cheap syntax contracts
        if: github.event_name == 'pull_request' && (needs.impact.result != 'success' || needs.impact.outputs.docsOnly != 'true')
        run: npm run check:syntax

      - name: Validate public MCP contracts
        if: github.event_name == 'pull_request' && (needs.impact.result != 'success' || needs.impact.outputs.docsOnly != 'true')
        run: npm run ci:contracts

      - name: Build shared test dependency
        if: >-
          github.event_name == 'pull_request' &&
          ((needs.impact.result != 'success' || needs.impact.outputs.shared == 'true') ||
           (needs.impact.result != 'success' || needs.impact.outputs.workspaceAgent == 'true') ||
           (needs.impact.result != 'success' || needs.impact.outputs.mcpGateway == 'true') ||
           (needs.impact.result != 'success' || needs.impact.outputs.browserWorker == 'true'))
        run: npm run build --workspace @vs-code-gpt/shared

      - name: Build Edge protocol test dependency
        if: >-
          github.event_name == 'pull_request' &&
          ((needs.impact.result != 'success' || needs.impact.outputs.edgeProtocol == 'true') || (needs.impact.result != 'success' || needs.impact.outputs.mcpGateway == 'true'))
        run: npm run build --workspace @mcp-access-stack/edge-protocol

      - name: Build Workspace Agent test dependency
        if: >-
          github.event_name == 'pull_request' &&
          ((needs.impact.result != 'success' || needs.impact.outputs.workspaceAgent == 'true') || (needs.impact.result != 'success' || needs.impact.outputs.mcpGateway == 'true'))
        run: npm run build --workspace @vs-code-gpt/local-agent

      - name: Test MCP core
        if: github.event_name == 'pull_request' && (needs.impact.result != 'success' || needs.impact.outputs.shared == 'true')
        run: npm run test:mcp-core

      - name: Test MCP Gateway
        if: github.event_name == 'pull_request' && (needs.impact.result != 'success' || needs.impact.outputs.mcpGateway == 'true')
        run: npm run test:mcp-gateway


      - name: Typecheck affected graph
        if: >-
          github.event_name == 'pull_request' &&
          (needs.impact.result != 'success' ||
           needs.impact.outputs.shared == 'true' ||
           needs.impact.outputs.edgeProtocol == 'true' ||
           needs.impact.outputs.workspaceAgent == 'true' ||
           needs.impact.outputs.mcpGateway == 'true' ||
           needs.impact.outputs.browserWorker == 'true' ||
           needs.impact.outputs.rootBroad == 'true')
        run: npm run typecheck

      - name: Build MCP Gateway
        if: github.event_name == 'pull_request' && (needs.impact.result != 'success' || needs.impact.outputs.mcpGateway == 'true')
        run: npm run build --workspace @vs-code-gpt/remote-mcp-gateway


      - name: Check Edge Gateway
        if: github.event_name == 'pull_request' && (needs.impact.result != 'success' || needs.impact.outputs.edgeGateway == 'true')
        run: npm run check:edge

      - name: Validate operations and policy scripts
        if: github.event_name == 'pull_request' && (needs.impact.result != 'success' || needs.impact.outputs.operationsTooling == 'true')
        run: npm run check:operations

  pr-browser-worker:
    needs: impact
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (needs.impact.result != 'success' || needs.impact.outputs.browserWorker == 'true')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp-access-stack
        shell: pwsh
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp-access-stack/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared test dependency
        run: npm run build --workspace @vs-code-gpt/shared

      - name: Install Playwright Chromium
        run: npx playwright install --only-shell chromium

      - name: Test Browser Worker
        run: npm run test:browser-worker

      - name: Build Browser Worker
        run: npm run build --workspace @vs-code-gpt/browser-worker
  pr-workspace-agent-unit:
    needs: impact
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (needs.impact.result != 'success' || needs.impact.outputs.workspaceAgent == 'true')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp-access-stack
        shell: pwsh
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp-access-stack/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared test dependency
        run: npm run build --workspace @vs-code-gpt/shared

      - name: Build Workspace Agent test dependency
        run: npm run build --workspace @vs-code-gpt/local-agent

      - name: Test Workspace Agent unit
        run: npm run test:workspace-agent:unit

  pr-workspace-agent-integration-e2e:
    needs: impact
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (needs.impact.result != 'success' || needs.impact.outputs.workspaceAgent == 'true')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp-access-stack
        shell: pwsh
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp-access-stack/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared test dependency
        run: npm run build --workspace @vs-code-gpt/shared

      - name: Build Workspace Agent test dependency
        run: npm run build --workspace @vs-code-gpt/local-agent

      - name: Test Workspace Agent integration
        run: npm run test:workspace-agent:integration

      - name: Test Workspace Agent e2e
        run: npm run test:workspace-agent:e2e

  pr-workspace-agent:
    needs:
      - impact
      - pr-workspace-agent-unit
      - pr-workspace-agent-integration-e2e
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (needs.impact.result != 'success' || needs.impact.outputs.workspaceAgent == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful Workspace Agent shards
        shell: bash
        env:
          UNIT_RESULT: ${{ needs.pr-workspace-agent-unit.result }}
          INTEGRATION_E2E_RESULT: ${{ needs.pr-workspace-agent-integration-e2e.result }}
        run: |
          set -euo pipefail
          test "$UNIT_RESULT" = "success"
          test "$INTEGRATION_E2E_RESULT" = "success"
  pr-runtime-assurance:
    needs: impact
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (needs.impact.result != 'success' || needs.impact.outputs.windowsRuntime == 'true')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp-access-stack
        shell: pwsh
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp-access-stack/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Windows and release runtime assurance
        run: npm run check:runtime-assurance

  check:
    needs:
      - impact
      - pr-validation
      - pr-browser-worker
      - pr-workspace-agent
      - pr-runtime-assurance
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful validation lanes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMPACT_RESULT: ${{ needs.impact.result }}
          BROWSER_WORKER_IMPACT: ${{ needs.impact.outputs.browserWorker }}
          WORKSPACE_AGENT_IMPACT: ${{ needs.impact.outputs.workspaceAgent }}
          WINDOWS_RUNTIME_IMPACT: ${{ needs.impact.outputs.windowsRuntime }}
          VALIDATION_RESULT: ${{ needs.pr-validation.result }}
          BROWSER_WORKER_RESULT: ${{ needs.pr-browser-worker.result }}
          WORKSPACE_AGENT_RESULT: ${{ needs.pr-workspace-agent.result }}
          RUNTIME_ASSURANCE_RESULT: ${{ needs.pr-runtime-assurance.result }}
        run: |
          set -euo pipefail
          test "$VALIDATION_RESULT" = "success"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$IMPACT_RESULT" != "success" || "$BROWSER_WORKER_IMPACT" == "true" ]]; then
              test "$BROWSER_WORKER_RESULT" = "success"
            else
              test "$BROWSER_WORKER_RESULT" = "skipped"
            fi
            if [[ "$IMPACT_RESULT" != "success" || "$WORKSPACE_AGENT_IMPACT" == "true" ]]; then
              test "$WORKSPACE_AGENT_RESULT" = "success"
            else
              test "$WORKSPACE_AGENT_RESULT" = "skipped"
            fi
            if [[ "$IMPACT_RESULT" != "success" || "$WINDOWS_RUNTIME_IMPACT" == "true" ]]; then
              test "$RUNTIME_ASSURANCE_RESULT" = "success"
            else
              test "$RUNTIME_ASSURANCE_RESULT" = "skipped"
            fi
          fi
  main-integration:
    name: main-${{ matrix.target }}
    needs: impact
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - core
          - node
          - workspace-agent
          - gateway
          - edge
    defaults:
      run:
        working-directory: mcp-access-stack
        shell: pwsh
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp-access-stack/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium for node shard
        if: matrix.target == 'node'
        run: npx playwright install chromium

      - name: Run main integration shard
        run: npm run ci:main:${{ matrix.target }}

  main-browser:
    name: main-browser
    needs: impact
    if: >-
      always() &&
      github.event_name == 'push' &&
      (needs.impact.result != 'success' || needs.impact.outputs.browserWorker == 'true')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp-access-stack
        shell: pwsh
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp-access-stack/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --only-shell chromium

      - name: Run main browser integration
        run: npm run ci:main:browser

  release-image-gateway:
    needs: impact
    if: >-
      always() &&
      (needs.impact.result != 'success' || needs.impact.outputs.dockerGateway == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build gateway release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./mcp-access-stack
          file: ./mcp-access-stack/deploy/docker/gateway.Dockerfile
          push: false
          tags: mcp-access-stack-gateway:ci
          cache-from: type=gha,scope=ci-gateway
          cache-to: type=gha,mode=max,scope=ci-gateway

  release-image-browser:
    needs: impact
    if: >-
      always() &&
      (needs.impact.result != 'success' || needs.impact.outputs.dockerBrowser == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build browser worker release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./mcp-access-stack
          file: ./mcp-access-stack/deploy/remote/browser-worker.Dockerfile
          push: false
          tags: mcp-access-stack-browser-worker:ci
          cache-from: type=gha,scope=ci-browser-worker
          cache-to: type=gha,mode=max,scope=ci-browser-worker

  release-image-proxy:
    needs: impact
    if: >-
      always() &&
      (needs.impact.result != 'success' || needs.impact.outputs.dockerProxy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build proxy release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./mcp-access-stack
          file: ./mcp-access-stack/deploy/docker/proxy.Dockerfile
          push: false
          tags: mcp-access-stack-proxy:ci
          cache-from: type=gha,scope=ci-proxy
          cache-to: type=gha,mode=max,scope=ci-proxy

  release-images:
    needs:
      - impact
      - release-image-gateway
      - release-image-browser
      - release-image-proxy
    if: >-
      always() &&
      (needs.impact.result != 'success' ||
       needs.impact.outputs.dockerGateway == 'true' ||
       needs.impact.outputs.dockerBrowser == 'true' ||
       needs.impact.outputs.dockerProxy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful release image builds
        shell: bash
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          GATEWAY_IMPACT: ${{ needs.impact.outputs.dockerGateway }}
          BROWSER_IMPACT: ${{ needs.impact.outputs.dockerBrowser }}
          PROXY_IMPACT: ${{ needs.impact.outputs.dockerProxy }}
          GATEWAY_RESULT: ${{ needs.release-image-gateway.result }}
          BROWSER_RESULT: ${{ needs.release-image-browser.result }}
          PROXY_RESULT: ${{ needs.release-image-proxy.result }}
        run: |
          set -euo pipefail
          require_lane() {
            local required="$1"
            local result="$2"
            local lane="$3"
            if [[ "$IMPACT_RESULT" != "success" || "$required" == "true" ]]; then
              if [[ "$result" != "success" ]]; then
                echo "$lane image build was required but finished as $result" >&2
                exit 1
              fi
            elif [[ "$result" != "skipped" ]]; then
              echo "$lane image build was not required but finished as $result" >&2
              exit 1
            fi
          }
          require_lane "$GATEWAY_IMPACT" "$GATEWAY_RESULT" gateway
          require_lane "$BROWSER_IMPACT" "$BROWSER_RESULT" browser
          require_lane "$PROXY_IMPACT" "$PROXY_RESULT" proxy
