name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shared: ${{ steps.impact.outputs.shared }}
      edgeProtocol: ${{ steps.impact.outputs.edgeProtocol }}
      workspaceAgent: ${{ steps.impact.outputs.workspaceAgent }}
      mcpGateway: ${{ steps.impact.outputs.mcpGateway }}
      edgeGateway: ${{ steps.impact.outputs.edgeGateway }}
      browserWorker: ${{ steps.impact.outputs.browserWorker }}
      windowsRuntime: ${{ steps.impact.outputs.windowsRuntime }}
      linuxRuntime: ${{ steps.impact.outputs.linuxRuntime }}
      operationsTooling: ${{ steps.impact.outputs.operationsTooling }}
      rootBroad: ${{ steps.impact.outputs.rootBroad }}
      docsOnly: ${{ steps.impact.outputs.docsOnly }}
      resolverFailed: ${{ steps.impact.outputs.resolverFailed }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26

      - name: Resolve changed scope
        id: impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node tooling/ci/resolve-impact.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Report fail-closed resolver fallback
        if: steps.impact.outputs.resolverFailed == 'true'
        shell: bash
        run: echo "Impact resolution failed; CI expanded to broad coverage."

  pr-validation:
    needs: impact
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
        shell: pwsh
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate impact resolver
        run: node tooling/ci/resolve-impact.test.mjs

      - name: Validate repository structure
        run: node tooling/structure/validate-repository-structure.test.mjs

      - name: Install dependencies
        if: github.event_name == 'pull_request' && (needs.impact.result != 'success' || needs.impact.outputs.docsOnly != 'true')
        run: npm ci


      - name: Validate cheap syntax contracts
        if: github.event_name == 'pull_request' && (needs.impact.result != 'success' || needs.impact.outputs.docsOnly != 'true')
        run: npm run check:syntax

      - name: Validate public MCP contracts
        if: github.event_name == 'pull_request' && (needs.impact.result != 'success' || needs.impact.outputs.docsOnly != 'true')
        run: npm run ci:contracts

      - name: Build shared test dependency
        if: >-
          github.event_name == 'pull_request' &&
          ((needs.impact.result != 'success' || needs.impact.outputs.shared == 'true') ||
           (needs.impact.result != 'success' || needs.impact.outputs.workspaceAgent == 'true') ||
           (needs.impact.result != 'success' || needs.impact.outputs.mcpGateway == 'true') ||
           (needs.impact.result != 'success' || needs.impact.outputs.browserWorker == 'true'))
        run: npm run build --workspace @vs-code-gpt/shared

      - name: Build Edge protocol test dependency
        if: >-
          github.event_name == 'pull_request' &&
          ((needs.impact.result != 'success' || needs.impact.outputs.edgeProtocol == 'true') || (needs.impact.result != 'success' || needs.impact.outputs.mcpGateway == 'true'))
        run: npm run build --workspace @mcp-access-stack/edge-protocol

      - name: Build Workspace Agent test dependency
        if: >-
          github.event_name == 'pull_request' &&
          ((needs.impact.result != 'success' || needs.impact.outputs.workspaceAgent == 'true') || (needs.impact.result != 'success' || needs.impact.outputs.mcpGateway == 'true'))
        run: npm run build --workspace @vs-code-gpt/local-agent

      - name: Test MCP core
        if: github.event_name == 'pull_request' && (needs.impact.result != 'success' || needs.impact.outputs.shared == 'true')
        run: npm run test:mcp-core

      - name: Test MCP Gateway
        if: github.event_name == 'pull_request' && (needs.impact.result != 'success' || needs.impact.outputs.mcpGateway == 'true')
        run: npm run test:mcp-gateway


      - name: Typecheck affected graph
        if: >-
          github.event_name == 'pull_request' &&
          (needs.impact.result != 'success' ||
           needs.impact.outputs.shared == 'true' ||
           needs.impact.outputs.edgeProtocol == 'true' ||
           needs.impact.outputs.workspaceAgent == 'true' ||
           needs.impact.outputs.mcpGateway == 'true' ||
           needs.impact.outputs.browserWorker == 'true' ||
           needs.impact.outputs.rootBroad == 'true')
        run: npm run typecheck

      - name: Build MCP Gateway
        if: github.event_name == 'pull_request' && (needs.impact.result != 'success' || needs.impact.outputs.mcpGateway == 'true')
        run: npm run build --workspace @vs-code-gpt/remote-mcp-gateway


      - name: Check Edge Gateway
        if: github.event_name == 'pull_request' && (needs.impact.result != 'success' || needs.impact.outputs.edgeGateway == 'true')
        run: npm run check:edge

      - name: Validate Edge manifest parity
        if: github.event_name == 'pull_request' && (needs.impact.result != 'success' || needs.impact.outputs.edgeGateway == 'true')
        run: npm run test:mcp-edge-manifest

      - name: Validate operations and policy scripts
        if: github.event_name == 'pull_request' && (needs.impact.result != 'success' || needs.impact.outputs.operationsTooling == 'true')
        run: npm run check:operations

  pr-browser-worker:
    needs: impact
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (needs.impact.result != 'success' || needs.impact.outputs.browserWorker == 'true')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
        shell: pwsh
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared test dependency
        run: npm run build --workspace @vs-code-gpt/shared

      - name: Install Playwright Chromium
        run: npx playwright install --only-shell chromium

      - name: Test Browser Worker
        run: npm run test:browser-worker

      - name: Build Browser Worker
        run: npm run build --workspace @vs-code-gpt/browser-worker
  pr-workspace-agent-unit:
    needs: impact
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (needs.impact.result != 'success' || needs.impact.outputs.workspaceAgent == 'true')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
        shell: pwsh
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared test dependency
        run: npm run build --workspace @vs-code-gpt/shared

      - name: Build Workspace Agent test dependency
        run: npm run build --workspace @vs-code-gpt/local-agent

      - name: Test Workspace Agent unit
        run: npm run test:workspace-agent:unit

  pr-workspace-agent-integration-shard-1-e2e:
    needs: impact
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (needs.impact.result != 'success' || needs.impact.outputs.workspaceAgent == 'true')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
        shell: pwsh
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared test dependency
        run: npm run build --workspace @vs-code-gpt/shared

      - name: Build Workspace Agent test dependency
        run: npm run build --workspace @vs-code-gpt/local-agent

      - name: Test Workspace Agent integration shard 1/2
        run: npm run test:workspace-agent:integration -- --shard=1/2

      - name: Test Workspace Agent e2e
        run: npm run test:workspace-agent:e2e

  pr-workspace-agent-integration-shard-2:
    needs: impact
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (needs.impact.result != 'success' || needs.impact.outputs.workspaceAgent == 'true')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
        shell: pwsh
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared test dependency
        run: npm run build --workspace @vs-code-gpt/shared

      - name: Build Workspace Agent test dependency
        run: npm run build --workspace @vs-code-gpt/local-agent

      - name: Test Workspace Agent integration shard 2/2
        run: npm run test:workspace-agent:integration -- --shard=2/2

  pr-workspace-agent:
    needs:
      - impact
      - pr-workspace-agent-unit
      - pr-workspace-agent-integration-shard-1-e2e
      - pr-workspace-agent-integration-shard-2
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (needs.impact.result != 'success' || needs.impact.outputs.workspaceAgent == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful Workspace Agent shards
        shell: bash
        env:
          UNIT_RESULT: ${{ needs.pr-workspace-agent-unit.result }}
          INTEGRATION_SHARD_1_E2E_RESULT: ${{ needs.pr-workspace-agent-integration-shard-1-e2e.result }}
          INTEGRATION_SHARD_2_RESULT: ${{ needs.pr-workspace-agent-integration-shard-2.result }}
        run: |
          set -euo pipefail
          test "$UNIT_RESULT" = "success"
          test "$INTEGRATION_SHARD_1_E2E_RESULT" = "success"
          test "$INTEGRATION_SHARD_2_RESULT" = "success"
  pr-windows-distribution:
    needs: impact
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (needs.impact.result != 'success' || needs.impact.outputs.windowsRuntime == 'true')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
        shell: pwsh
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Windows distribution
        run: pwsh -NoLogo -NoProfile -File deploy/windows/Test-WindowsDistribution.ps1

  pr-linux-runtime:
    needs: impact
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (needs.impact.result != 'success' || needs.impact.outputs.linuxRuntime == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Validate Linux execution runtime
        shell: bash
        run: bash deploy/linux/Test-McpEdgeConnectorRuntime.sh

  pr-runtime-assurance-core:
    needs: impact
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (needs.impact.result != 'success' || needs.impact.outputs.windowsRuntime == 'true')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
        shell: pwsh
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate runtime assurance core
        run: npm run check:runtime-assurance:core

  pr-runtime-assurance:
    needs:
      - impact
      - pr-windows-distribution
      - pr-runtime-assurance-core
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (needs.impact.result != 'success' || needs.impact.outputs.windowsRuntime == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful runtime assurance shards
        shell: bash
        env:
          WINDOWS_DISTRIBUTION_RESULT: ${{ needs.pr-windows-distribution.result }}
          RUNTIME_CORE_RESULT: ${{ needs.pr-runtime-assurance-core.result }}
        run: |
          set -euo pipefail
          test "$WINDOWS_DISTRIBUTION_RESULT" = "success"
          test "$RUNTIME_CORE_RESULT" = "success"
  check:
    needs:
      - impact
      - pr-validation
      - pr-browser-worker
      - pr-workspace-agent
      - pr-runtime-assurance
      - pr-linux-runtime
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful validation lanes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMPACT_RESULT: ${{ needs.impact.result }}
          BROWSER_WORKER_IMPACT: ${{ needs.impact.outputs.browserWorker }}
          WORKSPACE_AGENT_IMPACT: ${{ needs.impact.outputs.workspaceAgent }}
          WINDOWS_RUNTIME_IMPACT: ${{ needs.impact.outputs.windowsRuntime }}
          LINUX_RUNTIME_IMPACT: ${{ needs.impact.outputs.linuxRuntime }}
          VALIDATION_RESULT: ${{ needs.pr-validation.result }}
          BROWSER_WORKER_RESULT: ${{ needs.pr-browser-worker.result }}
          WORKSPACE_AGENT_RESULT: ${{ needs.pr-workspace-agent.result }}
          RUNTIME_ASSURANCE_RESULT: ${{ needs.pr-runtime-assurance.result }}
          LINUX_RUNTIME_RESULT: ${{ needs.pr-linux-runtime.result }}
        run: |
          set -euo pipefail
          test "$VALIDATION_RESULT" = "success"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$IMPACT_RESULT" != "success" || "$BROWSER_WORKER_IMPACT" == "true" ]]; then
              test "$BROWSER_WORKER_RESULT" = "success"
            else
              test "$BROWSER_WORKER_RESULT" = "skipped"
            fi
            if [[ "$IMPACT_RESULT" != "success" || "$WORKSPACE_AGENT_IMPACT" == "true" ]]; then
              test "$WORKSPACE_AGENT_RESULT" = "success"
            else
              test "$WORKSPACE_AGENT_RESULT" = "skipped"
            fi
            if [[ "$IMPACT_RESULT" != "success" || "$WINDOWS_RUNTIME_IMPACT" == "true" ]]; then
              test "$RUNTIME_ASSURANCE_RESULT" = "success"
            else
              test "$RUNTIME_ASSURANCE_RESULT" = "skipped"
            fi
            if [[ "$IMPACT_RESULT" != "success" || "$LINUX_RUNTIME_IMPACT" == "true" ]]; then
              test "$LINUX_RUNTIME_RESULT" = "success"
            else
              test "$LINUX_RUNTIME_RESULT" = "skipped"
            fi
          fi
  main-integration:
    name: main-${{ matrix.target }}
    needs: impact
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - core
          - node
          - workspace-agent
          - gateway
          - edge
    defaults:
      run:
        working-directory: .
        shell: pwsh
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium for node shard
        if: matrix.target == 'node'
        run: npx playwright install chromium

      - name: Run main integration shard
        run: npm run ci:main:${{ matrix.target }}

  main-linux-runtime:
    name: main-linux-runtime
    needs: impact
    if: >-
      always() &&
      github.event_name == 'push' &&
      (needs.impact.result != 'success' || needs.impact.outputs.linuxRuntime == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Linux execution runtime
        shell: bash
        run: bash deploy/linux/Test-McpEdgeConnectorRuntime.sh

  main-browser:
    name: main-browser
    needs: impact
    if: >-
      always() &&
      github.event_name == 'push' &&
      (needs.impact.result != 'success' || needs.impact.outputs.browserWorker == 'true')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
        shell: pwsh
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --only-shell chromium

      - name: Run main browser integration
        run: npm run ci:main:browser

  companion-portability:
    name: companion-portability-${{ matrix.os }}
    needs: impact
    if: >-
      always() &&
      (needs.impact.result != 'success' || needs.impact.outputs.docsOnly != 'true')
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build companion portability graph
        run: |
          npm run build --workspace @vs-code-gpt/shared
          npm run build --workspace @mcp-access-stack/edge-protocol
          npm run build --workspace @vs-code-gpt/local-agent
          npm run build --workspace @vs-code-gpt/remote-mcp-gateway

      - name: Build Windows browser capability
        if: runner.os == 'Windows'
        run: npm run build --workspace @vs-code-gpt/browser-worker

      - name: Test Windows browser, elevation and lifecycle contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node tooling/testing/run-jest.mjs --config services/mcp-gateway/jest.config.ts --runInBand --runTestsByPath services/mcp-gateway/test/unit/companion/local-browser-worker.test.ts
          node tooling/testing/run-jest.mjs --config services/workspace-agent/jest.config.ts --runInBand --runTestsByPath services/workspace-agent/test/unit/shell/elevation-broker.test.ts
          pwsh -NoLogo -NoProfile -File deploy/windows/Test-McpV3LocalLifecycle.ps1

      - name: Test platform secure store and repository policy
        run: |
          node tooling/testing/run-jest.mjs --config services/mcp-gateway/jest.config.ts --runInBand --runTestsByPath \
            services/mcp-gateway/test/unit/companion/platform-oauth-credential-store.test.ts \
            services/mcp-gateway/test/unit/companion/local-repository-manager.test.ts

      - name: Test native shell process runner
        run: |
          node tooling/testing/run-jest.mjs --config services/workspace-agent/jest.config.ts --runInBand --runTestsByPath \
            services/workspace-agent/test/integration/shell/process-runner.test.ts

      - name: Validate Unix lifecycle scripts
        if: runner.os != 'Windows'
        run: |
          bash -n deploy/unix/McpV3Local.Common.sh
          bash -n deploy/linux/Install-McpV3Local.sh
          bash -n deploy/linux/Update-McpV3Local.sh
          bash -n deploy/linux/Uninstall-McpV3Local.sh
          bash -n deploy/macos/Install-McpV3Local.sh
          bash -n deploy/macos/Update-McpV3Local.sh
          bash -n deploy/macos/Uninstall-McpV3Local.sh
          node --check tooling/release/New-McpV3LocalPackage.mjs
          node --check tooling/release/Verify-McpV3LocalPackage.mjs
          node --check tooling/release/New-McpV3LinuxDeb.mjs
          node --check tooling/release/New-McpV3MacPkg.mjs

      - name: Build immutable Unix local package
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse --verify HEAD^{commit})"
          output="$RUNNER_TEMP/mcp-v3-local-package"
          node tooling/release/New-McpV3LocalPackage.mjs \
            --release-id "0.0.0-ci.${GITHUB_RUN_ID}" \
            --source-commit "$source_commit" \
            --edge-base-url "https://example.invalid/" \
            --build-run-id "$GITHUB_RUN_ID" \
            --output "$output"
          "$output/runtime/node/node" --version
          test -f "$output/node_modules/@vs-code-gpt/remote-mcp-gateway/dist/companion-cli.js"
          test -f "$output/deploy/unix/McpV3Local.Common.sh"
          test -f "$output/mcp-v3-local-manifest.json"
          bash deploy/unix/Test-McpV3LocalLifecycle.sh \
            --package-root "$output" \
            --expected-edge "https://example.invalid/"

      - name: Build Linux native package
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          deb="$RUNNER_TEMP/mcp-v3-local.deb"
          node tooling/release/New-McpV3LinuxDeb.mjs \
            --package-root "$RUNNER_TEMP/mcp-v3-local-package" \
            --release-id "0.0.0-ci.${GITHUB_RUN_ID}" \
            --compression-level 1 \
            --output "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E '^-rw-r--r-- .*\./usr/share/applications/mcp-v3\.desktop$'
          dpkg-deb --contents "$deb" | grep -F './usr/bin/mcp-v3'
          dpkg-deb --field "$deb" Depends | grep -F 'libsecret-tools'

      - name: Build macOS native package
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/mcp-v3-local.pkg"
          node tooling/release/New-McpV3MacPkg.mjs \
            --package-root "$RUNNER_TEMP/mcp-v3-local-package" \
            --release-id "0.0.0-ci.${GITHUB_RUN_ID}" \
            --output "$pkg"
          pkgutil --payload-files "$pkg" | grep -F 'usr/local/bin/mcp-v3'
          pkgutil --payload-files "$pkg" | grep -F 'usr/local/bin/mcp-v3-local-install'
          pkgutil --payload-files "$pkg" | grep -F 'Library/Application Support/MCP V3/Bootstrap'

