name: Guarded beta.84 bridge activation or rollback

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact approved main SHA with green CI
        required: true
        type: string
      operation:
        description: Activate the pinned bridge or roll it back to the pinned original
        required: true
        type: choice
        options:
          - activate
          - rollback
      expected_active_deployment_id:
        description: Active deployment UUID from fresh Cloudflare GET provenance
        required: true
        type: string
      expected_active_version_id:
        description: Active immutable version UUID (100 percent traffic)
        required: true
        type: string
      target_version_id:
        description: Pinned immutable target version UUID
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Shares mutex with all existing Edge releases and version uploads.
concurrency:
  group: public-release-edge
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact main, approved CI and single run without Cloudflare access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          ACTIVATION_MODE: ${{ inputs.operation }}
          EXPECTED_ACTIVE_DEPLOYMENT_ID: ${{ inputs.expected_active_deployment_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ inputs.expected_active_version_id }}
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "iFael/mcp-access-stack" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_ACTIVE_DEPLOYMENT_ID" =~ ^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$ ]]
          [[ "$EXPECTED_ACTIVE_VERSION_ID" =~ ^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$ ]]
          [[ "$TARGET_VERSION_ID" =~ ^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$ ]]
          [[ "$ACTIVATION_MODE" == "activate" || "$ACTIVATION_MODE" == "rollback" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$(gh api repos/iFael/mcp-access-stack/git/ref/heads/main --jq '.object.sha')" == "$EXPECTED_MAIN_SHA" ]]
          ci_count="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch main \
            --commit "$EXPECTED_MAIN_SHA" --event push --status success --limit 20 \
            --json headSha,status,conclusion \
            --jq '[.[] | select(.headSha == env.EXPECTED_MAIN_SHA and .status == "completed" and .conclusion == "success")] | length')"
          [[ "$ci_count" =~ ^[1-9][0-9]*$ ]]
          echo "Immutable main, green CI and one-shot dispatch verified."

  transition:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    name: Guarded one-shot immutable version traffic transition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: public-release
    permissions:
      contents: read
    steps:
      - name: Checkout exact SHA with no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_main_sha }}
          persist-credentials: false

      - name: Setup Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26

      - name: Reconcile branch and one-shot attempt after Environment protection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$(gh api repos/iFael/mcp-access-stack/git/ref/heads/main --jq '.object.sha')" == "$EXPECTED_MAIN_SHA" ]]

      - name: Read-only immutable version and active deployment CAS preflight
        shell: bash
        env:
          ACTIVATION_MODE: ${{ inputs.operation }}
          EXPECTED_ACTIVE_DEPLOYMENT_ID: ${{ inputs.expected_active_deployment_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ inputs.expected_active_version_id }}
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node tooling/release/activate-edge-beta84-bridge.mjs preflight

      - name: One-shot deployment (never force or automatic retry)
        shell: bash
        env:
          ACTIVATION_MODE: ${{ inputs.operation }}
          EXPECTED_ACTIVE_DEPLOYMENT_ID: ${{ inputs.expected_active_deployment_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ inputs.expected_active_version_id }}
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # The script repeats the CAS read before its only POST and verifies
          # the resulting deployment through bounded GET-only reconciliation.
          # An ambiguous result is STOP, never another POST.
          node tooling/release/activate-edge-beta84-bridge.mjs execute
