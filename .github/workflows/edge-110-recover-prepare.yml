name: Recover Edge 110 candidate only (no deployment)

run-name: mcp-edge-110-prepare-recovery-${{ inputs.operation_id }}

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact main SHA with successful post-merge CI
        required: true
        type: string
      operation_id:
        description: Existing Edge deployment operation UUID (must match original)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: public-release-edge
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify main CI and previously applied single Edge deployment without credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "iFael/mcp-access-stack" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$OPERATION_ID" == "25cba5db-d747-4b2c-9f12-899549a31e4c" ]]
          [[ "$(gh api repos/iFael/mcp-access-stack/git/ref/heads/main --jq '.object.sha')" == "$EXPECTED_MAIN_SHA" ]]
          ci_count="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch main \
            --commit "$EXPECTED_MAIN_SHA" --event push --status success --limit 20 \
            --json headSha,status,conclusion \
            --jq '[.[] | select(.headSha == env.EXPECTED_MAIN_SHA and .status == "completed" and .conclusion == "success")] | length')"
          [[ "$ci_count" =~ ^[1-9][0-9]*$ ]]

          # No duplicate recovery dispatch with this stable operation identity.
          count="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow edge-110-recover-prepare.yml \
            --limit 100 --json databaseId,displayTitle \
            --jq '[.[] | select(.displayTitle == ("mcp-edge-110-prepare-recovery-" + env.OPERATION_ID))] | length')"
          [[ "$count" == "1" ]]

          # The original activation performed the deployment; the prepare step was skipped.
          original="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39887765204" \
            --jq '[.head_sha,.event,.status,.conclusion,.run_attempt,.path,.display_title] | @tsv')"
          IFS=$'\t' read -r original_sha original_event original_status original_conclusion original_attempt original_path original_title <<< "$original"
          [[ "$original_sha" == "f1659911a72282e5a0b2ffc3229886665425267b" ]]
          [[ "$original_event" == "workflow_dispatch" && "$original_status" == "completed" ]]
          [[ "$original_conclusion" == "failure" && "$original_attempt" == "1" ]]
          [[ "$original_path" == ".github/workflows/edge-catalog-110-activate.yml" ]]
          [[ "$original_title" == "mcp-edge-catalog-110-$OPERATION_ID" ]]

          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39887765204/jobs")"
          [[ "$(jq -r '[.jobs[] | select(.name == "preflight" and .conclusion == "success")] | length' <<< "$jobs")" == "1" ]]
          [[ "$(jq -r '[.jobs[] | select(.name == "publish") | .steps[] | select(.name == "Read-only dual Cloudflare CAS and active contract health" and .conclusion == "success")] | length' <<< "$jobs")" == "1" ]]
          [[ "$(jq -r '[.jobs[] | select(.name == "publish") | .steps[] | select(.name == "ONE 100-percent Cloudflare deployment, no automatic retry" and .conclusion == "failure")] | length' <<< "$jobs")" == "1" ]]
          [[ "$(jq -r '[.jobs[] | select(.name == "publish") | .steps[] | select(.name == "ONE authenticated candidate preparation after verified deployment" and .conclusion == "skipped")] | length' <<< "$jobs")" == "1" ]]

          staged="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39887613300" \
            --jq '[.head_sha,.event,.status,.conclusion,.run_attempt,.path] | @tsv')"
          IFS=$'\t' read -r stage_sha stage_event stage_status stage_conclusion stage_attempt stage_path <<< "$staged"
          [[ "$stage_sha" == "f1659911a72282e5a0b2ffc3229886665425267b" ]]
          [[ "$stage_event" == "workflow_dispatch" && "$stage_status" == "completed" && "$stage_conclusion" == "success" ]]
          [[ "$stage_attempt" == "1" && "$stage_path" == ".github/workflows/edge-cas-candidate-stage.yml" ]]
          receipt="$(gh run view 39887613300 --repo "$GITHUB_REPOSITORY" --log |
            grep -oE 'EDGE_CAS_STAGE_UPLOADED_NO_TRAFFIC version_id=[a-f0-9-]+' || true)"
          [[ "$receipt" == "EDGE_CAS_STAGE_UPLOADED_NO_TRAFFIC version_id=ef25f841-7b6a-41e1-b4cf-f1fd429c1518" ]]

          # The recovery commit must not alter the Worker, its manifest or the previously verified executor.
          diff="$(gh api "repos/$GITHUB_REPOSITORY/compare/f1659911a72282e5a0b2ffc3229886665425267b...$EXPECTED_MAIN_SHA" \
            --jq '[.status, (.files | map(.filename) | sort | join(","))] | @tsv')"
          IFS=$'\t' read -r diff_status diff_files <<< "$diff"
          [[ "$diff_status" == "ahead" ]]
          [[ "$diff_files" == ".github/workflows/edge-110-recover-prepare.yml,tooling/release/edge-110-recover-prepare.test.mjs" ]]
          echo "EDGE_110_PREPARE_RECOVERY_PREFLIGHT_VERIFIED"

  prepare:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: public-release
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout the exact validated main SHA without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_main_sha }}
          persist-credentials: false
      - name: Set up pinned Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - name: Reconcile SHA and single recovery after Environment approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$(gh api repos/iFael/mcp-access-stack/git/ref/heads/main --jq '.object.sha')" == "$EXPECTED_MAIN_SHA" ]]
          count="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow edge-110-recover-prepare.yml \
            --limit 100 --json databaseId,displayTitle \
            --jq '[.[] | select(.displayTitle == ("mcp-edge-110-prepare-recovery-" + env.OPERATION_ID))] | length')"
          [[ "$count" == "1" ]]
      - name: Install pinned packages and validate recovery contract
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test tooling/release/edge-110-recover-prepare.test.mjs \
            tooling/release/activate-edge-catalog-110.test.mjs
      - name: ONE authenticated candidate preparation, no Worker deployment
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MCP_CONTRACT_PREPARE_TOKEN: ${{ secrets.MCP_CONTRACT_PREPARE_TOKEN }}
          EXPECTED_ACTIVE_DEPLOYMENT_ID: 53198352-68ba-40fd-9be6-2cd9254e9c22
          EXPECTED_ACTIVE_VERSION_ID: 779717e8-9f6d-4ecb-b274-99cdbb28e4e5
          STAGED_VERSION_ID: ef25f841-7b6a-41e1-b4cf-f1fd429c1518
          NEW_DEPLOYMENT_ID: 5f1f8bdd-fb57-49ac-9838-c7f0130c145f
          EDGE_CATALOG_STAGE_RUN_ID: "39887613300"
          EDGE_CATALOG_OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          set -euo pipefail
          node tooling/release/activate-edge-catalog-110.mjs prepare
