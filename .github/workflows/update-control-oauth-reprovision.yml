name: Update Control OAuth controlled reprovision

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: "UUID for this exact reprovision intent. Reuse the same UUID to reconcile this operation."
        required: true
        type: string
      mode:
        description: "Diagnose the operation or apply the same operation ID after preflight."
        required: true
        type: choice
        default: diagnose
        options:
          - diagnose
          - apply

permissions:
  contents: read

concurrency:
  group: update-control-production
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'diagnose' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: update-control-production
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Diagnose operation status with administrative HMAC-SHA-256
        env:
          UPDATE_CONTROL_OAUTH_OPERATION_ID: ${{ inputs.operation_id }}
          MCP_UPDATE_CONTROL_PUBLIC_URL: ${{ vars.MCP_UPDATE_CONTROL_PUBLIC_URL }}
          UPDATE_CONTROL_ADMIN_HMAC_KEY: ${{ secrets.UPDATE_CONTROL_ADMIN_HMAC_KEY }}
        run: node tooling/update-control-oauth-reprovision.mjs diagnose

  reprovision:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: update-control-production
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check the same operation ID with administrative HMAC-SHA-256
        id: preflight
        env:
          UPDATE_CONTROL_OAUTH_MODE: ${{ inputs.mode }}
          UPDATE_CONTROL_OAUTH_OPERATION_ID: ${{ inputs.operation_id }}
          MCP_UPDATE_CONTROL_PUBLIC_URL: ${{ vars.MCP_UPDATE_CONTROL_PUBLIC_URL }}
          UPDATE_CONTROL_ADMIN_HMAC_KEY: ${{ secrets.UPDATE_CONTROL_ADMIN_HMAC_KEY }}
        run: node tooling/update-control-oauth-reprovision.mjs preflight
      - name: Reconcile and apply the same operation ID
        if: steps.preflight.outputs.completed != 'true'
        env:
          UPDATE_CONTROL_OAUTH_MODE: ${{ inputs.mode }}
          UPDATE_CONTROL_OAUTH_OPERATION_ID: ${{ inputs.operation_id }}
          MCP_UPDATE_CONTROL_PUBLIC_URL: ${{ vars.MCP_UPDATE_CONTROL_PUBLIC_URL }}
          UPDATE_CONTROL_ADMIN_HMAC_KEY: ${{ secrets.UPDATE_CONTROL_ADMIN_HMAC_KEY }}
        run: node tooling/update-control-oauth-reprovision.mjs apply
