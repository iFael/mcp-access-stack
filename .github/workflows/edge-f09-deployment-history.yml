name: Read-only f09 Cloudflare deployment history

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact main SHA authorized for this read-only reconciliation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-f09-deployment-audit
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-observability
    steps:
      - name: Read-only exact SHA guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "iFael/mcp-access-stack" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(gh api repos/iFael/mcp-access-stack/git/ref/heads/main --jq '.object.sha')" == "$EXPECTED_MAIN_SHA" ]]
      - name: Checkout read-only audit at pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_main_sha }}
          persist-credentials: false
      - name: Use Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - name: Verify audit unit regressions
        run: node --test tooling/release/audit-edge-f09-deployment-history.test.mjs
      - name: Two Cloudflare GET snapshots (never POST)
        shell: bash
        env:
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROVENANCE_READ_TOKEN: ${{ secrets.CF_PROVENANCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          node tooling/release/audit-edge-f09-deployment-history.mjs
