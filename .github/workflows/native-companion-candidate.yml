name: Native companion candidate

on:
  push:
    tags:
      - "candidate/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-companion-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  edge-preview:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'candidate/r10-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: public-release
    permissions:
      contents: read
    outputs:
      preview_url: ${{ steps.preview.outputs.preview_url }}
      workers_dev_enabled_before: ${{ steps.subdomain.outputs.workers_dev_enabled_before }}
      previews_enabled_before: ${{ steps.subdomain.outputs.previews_enabled_before }}
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Edge protocol
        run: npm run build --workspace @mcp-access-stack/edge-protocol

      - name: Read Worker Preview URL state
        id: subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/mcp-access-stack/subdomain"
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$api")"
          if [[ "$(jq -r '.success // false' <<<"$response")" != "true" ]]; then
            echo "Unable to read Worker subdomain state." >&2
            exit 1
          fi
          workers_dev_enabled="$(jq -r '.result.enabled // empty' <<<"$response")"
          previews_enabled="$(jq -r '.result.previews_enabled // empty' <<<"$response")"
          if [[ "$workers_dev_enabled" != "true" && "$workers_dev_enabled" != "false" ]]; then
            echo "Worker workers.dev state is invalid." >&2
            exit 1
          fi
          if [[ "$previews_enabled" != "true" && "$previews_enabled" != "false" ]]; then
            echo "Worker Preview URL state is invalid." >&2
            exit 1
          fi
          echo "workers_dev_enabled_before=$workers_dev_enabled" >> "$GITHUB_OUTPUT"
          echo "previews_enabled_before=$previews_enabled" >> "$GITHUB_OUTPUT"
          echo "Worker Preview URL state captured: workers_dev=$workers_dev_enabled previews_enabled=$previews_enabled"

      - name: Enable Worker Preview URLs temporarily
        if: steps.subdomain.outputs.previews_enabled_before != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_DEV_ENABLED_BEFORE: ${{ steps.subdomain.outputs.workers_dev_enabled_before }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/mcp-access-stack/subdomain"
          payload="$(jq -n --argjson enabled "$WORKERS_DEV_ENABLED_BEFORE" '{enabled:$enabled,previews_enabled:true}')"
          response="$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$api")"
          if [[ "$(jq -r '.success // false' <<<"$response")" != "true" ||
                "$(jq -r '.result.enabled // empty' <<<"$response")" != "$WORKERS_DEV_ENABLED_BEFORE" ||
                "$(jq -r '.result.previews_enabled // false' <<<"$response")" != "true" ]]; then
            echo "Failed to enable Worker Preview URLs without changing workers.dev state." >&2
            exit 1
          fi
          echo "Worker Preview URLs enabled temporarily for R10 homologation."

      - name: Create isolated R10 Preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_DEV_ENABLED_BEFORE: ${{ steps.subdomain.outputs.workers_dev_enabled_before }}
          PREVIEWS_ENABLED_BEFORE: ${{ steps.subdomain.outputs.previews_enabled_before }}
        shell: bash
        run: |
          set -euo pipefail
          preview_name="r10-homologation"
          secrets_file="$RUNNER_TEMP/mcp-v3-preview-secrets.json"
          access_file="$RUNNER_TEMP/mcp-v3-preview-access.txt"
          result_file="$RUNNER_TEMP/mcp-v3-preview-result.json"

          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          owner_password="$(openssl rand -base64 36 | tr -d '\r\n')"
          echo "::add-mask::$owner_password"
          umask 077
          jq -n --arg token "$owner_password" '{MCP_OWNER_TOKEN:$token}' > "$secrets_file"

          npx wrangler preview \
            --cwd . \
            --config services/mcp-edge-gateway/wrangler.jsonc \
            --name "$preview_name" \
            --tag "r10-${GITHUB_RUN_ID}" \
            --message "MCP V3 R10 interactive homologation" \
            --secrets-file "$secrets_file" \
            --ignore-base-config \
            --json > "$result_file"
          rm -f "$secrets_file"

          preview_url="$(jq -r '.preview.urls[0] // empty' "$result_file")"
          deployment_url="$(jq -r '.deployment.urls[0] // empty' "$result_file")"
          expected_preview_url="$(jq -r '.previews.vars.MCP_PUBLIC_BASE_URL // empty' services/mcp-edge-gateway/wrangler.jsonc)"
          if [[ ! "$preview_url" =~ ^https://[^/?#]+/?$ ||
                ! "$expected_preview_url" =~ ^https://[^/?#]+/?$ ]]; then
            echo "Wrangler did not return a valid stable R10 Preview URL." >&2
            jq '{
              preview: {
                id: .preview.id,
                name: .preview.name,
                slug: .preview.slug,
                urls: .preview.urls
              },
              deployment: {
                id: .deployment.id,
                urls: .deployment.urls
              }
            }' "$result_file" >&2 || true
            exit 1
          fi
          preview_url="${preview_url%/}/"
          expected_preview_url="${expected_preview_url%/}/"
          if [[ "$preview_url" != "$expected_preview_url" ]]; then
            echo "Wrangler Preview URL does not match MCP_PUBLIC_BASE_URL." >&2
            echo "preview_url=$preview_url" >&2
            echo "expected_preview_url=$expected_preview_url" >&2
            echo "deployment_url=$deployment_url" >&2
            exit 1
          fi
          echo "Wrangler stable R10 Preview URL: $preview_url"
          if [[ "$deployment_url" =~ ^https://[^/?#]+/?$ ]]; then
            deployment_url="${deployment_url%/}/"
            echo "Wrangler immutable R10 deployment URL: $deployment_url"
          else
            deployment_url=''
            echo "Wrangler did not return an immutable deployment URL."
          fi

          stable_body="$RUNNER_TEMP/r10-stable-health.txt"
          stable_headers="$RUNNER_TEMP/r10-stable-health.headers"
          stable_code="$(curl --silent --show-error \
            --output "$stable_body" \
            --dump-header "$stable_headers" \
            --write-out '%{http_code}' \
            "$preview_url/health" || true)"
          echo "Initial stable Preview /health status: $stable_code"
          grep -Ei '^(server|cf-ray|content-type):' "$stable_headers" || true

          deployment_code=''
          if [[ -n "$deployment_url" ]]; then
            deployment_body="$RUNNER_TEMP/r10-deployment-health.txt"
            deployment_headers="$RUNNER_TEMP/r10-deployment-health.headers"
            deployment_code="$(curl --silent --show-error \
              --output "$deployment_body" \
              --dump-header "$deployment_headers" \
              --write-out '%{http_code}' \
              "$deployment_url/health" || true)"
            echo "Initial immutable deployment /health status: $deployment_code"
            grep -Ei '^(server|cf-ray|content-type):' "$deployment_headers" || true
          fi

          hosted_validation="deferred-regional"
          health=''
          for attempt in $(seq 1 6); do
            stable_code="$(curl --silent --output "$stable_body" --write-out '%{http_code}' "$preview_url/health" 2>/dev/null || true)"
            if [[ "$stable_code" == "200" ]]; then
              health="$(cat "$stable_body")"
              break
            fi
            if [[ "$stable_code" != "404" && "$stable_code" != "000" ]]; then
              echo "R10 Preview became reachable with unexpected HTTP status $stable_code." >&2
              head -c 1024 "$stable_body" >&2 || true
              echo >&2
              exit 1
            fi
            sleep 5
          done

          if [[ -n "$health" ]]; then
            service="$(jq -r '.service // empty' <<<"$health")"
            status="$(jq -r '.status // empty' <<<"$health")"
            control_ready="$(jq -r '.controlPlaneReady // false' <<<"$health")"
            if [[ "$service" != "mcp-edge-gateway" || "$status" != "ok" || "$control_ready" != "true" ]]; then
              echo "R10 Preview returned HTTP 200 with invalid health payload." >&2
              exit 1
            fi

            oauth="$(curl --fail --silent --show-error "$preview_url/.well-known/oauth-authorization-server")"
            issuer="$(jq -r '.issuer // empty' <<<"$oauth")"
            authorize="$(jq -r '.authorization_endpoint // empty' <<<"$oauth")"
            if [[ "$issuer" != "$preview_url" || "$authorize" != "${preview_url}authorize" ]]; then
              echo "R10 Preview OAuth metadata does not match the isolated Preview URL." >&2
              exit 1
            fi
            hosted_validation="healthy"
            echo "Hosted runner validated R10 Preview health and OAuth metadata."
          else
            echo "Hosted runner still sees regional Preview routing as unavailable; external Oracle/GRU validation is required before installation."
          fi

          {
            printf 'preview_url=%s\n' "$preview_url"
            printf 'owner_password=%s\n' "$owner_password"
            printf 'preview_name=%s\n' "$preview_name"
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'candidate_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'workers_dev_enabled_before=%s\n' "$WORKERS_DEV_ENABLED_BEFORE"
            printf 'previews_enabled_before=%s\n' "$PREVIEWS_ENABLED_BEFORE"
            printf 'hosted_validation=%s\n' "$hosted_validation"
          } > "$access_file"
          chmod 600 "$access_file"

          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "hosted_validation=$hosted_validation" >> "$GITHUB_OUTPUT"
          echo "MCP V3 isolated R10 Preview created at $preview_url (hosted_validation=$hosted_validation)"

      - name: Upload Preview access artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-v3-preview-access-${{ github.run_id }}
          path: ${{ runner.temp }}/mcp-v3-preview-access.txt
          if-no-files-found: error
          retention-days: 3

  windows-signed-candidate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'candidate/r10-')
    needs: edge-preview
    runs-on: windows-latest
    timeout-minutes: 35
    environment: public-release
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
        shell: pwsh
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve candidate metadata
        id: metadata
        env:
          PREVIEW_EDGE_BASE_URL: ${{ needs.edge-preview.outputs.preview_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (git rev-parse --verify 'HEAD^{commit}').Trim()
          if ($commit -notmatch '^[a-f0-9]{40}$') {
            throw 'Candidate commit is invalid.'
          }
          $releaseId = "0.0.0-r10-candidate.$env:GITHUB_RUN_ID"
          $releaseTag = "v$releaseId"
          try {
            $edgeUri = [Uri]$env:PREVIEW_EDGE_BASE_URL
          }
          catch {
            throw 'Preview Edge base URL is invalid.'
          }
          if (-not $edgeUri.IsAbsoluteUri -or
              $edgeUri.Scheme -ne 'https' -or
              $edgeUri.AbsolutePath -ne '/' -or
              -not [string]::IsNullOrWhiteSpace($edgeUri.UserInfo) -or
              -not [string]::IsNullOrWhiteSpace($edgeUri.Query) -or
              -not [string]::IsNullOrWhiteSpace($edgeUri.Fragment)) {
            throw 'Preview Edge base URL must be a credential-free HTTPS origin.'
          }
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_id=$releaseId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "edge_base_url=$($edgeUri.GetLeftPart([UriPartial]::Authority))/" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Windows runtime
        run: npm run build

      - name: Build immutable Windows release
        env:
          RELEASE_ID: ${{ steps.metadata.outputs.release_id }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          pwsh -NoLogo -NoProfile -File deploy/windows/New-McpRelease.ps1 `
            -ReleaseId $env:RELEASE_ID `
            -SourceCommit $env:SOURCE_COMMIT `
            -BuildRunId ([long]$env:GITHUB_RUN_ID) `
            -OutputDirectory (Join-Path $PWD "releases\$env:RELEASE_ID")

      - name: Build Windows native artifacts
        env:
          RELEASE_ID: ${{ steps.metadata.outputs.release_id }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          pwsh -NoLogo -NoProfile -File deploy/windows/New-McpWindowsExecutionNodeArtifacts.ps1 `
            -ReleaseId $env:RELEASE_ID `
            -SourceCommit $env:SOURCE_COMMIT `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'execution-node-native')

      - name: Assemble and sign candidate distribution
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          RELEASE_ID: ${{ steps.metadata.outputs.release_id }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
          EDGE_BASE_URL: ${{ steps.metadata.outputs.edge_base_url }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            throw 'Windows signing secrets are unavailable.'
          }
          pwsh -NoLogo -NoProfile -File deploy/windows/New-McpPublicDistribution.ps1 `
            -ReleaseId $env:RELEASE_ID `
            -SourceCommit $env:SOURCE_COMMIT `
            -ReleaseTag $env:RELEASE_TAG `
            -BuildRunId ([long]$env:GITHUB_RUN_ID) `
            -ExecutionNodeNativeDirectory (Join-Path $env:RUNNER_TEMP 'execution-node-native') `
            -EdgeBaseUrl $env:EDGE_BASE_URL `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'candidate-distribution')

      - name: Validate signed candidate
        env:
          RELEASE_ID: ${{ steps.metadata.outputs.release_id }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          pwsh -NoLogo -NoProfile -File deploy/windows/Test-WindowsDistribution.ps1
          pwsh -NoLogo -NoProfile -File deploy/windows/Test-McpWindowsExecutionNodePackage.ps1 `
            -ReleaseRoot (Join-Path $env:RUNNER_TEMP "candidate-distribution\stage\releases\$env:RELEASE_ID") `
            -OfflinePinnedAuthenticode
          $asset = Join-Path $env:RUNNER_TEMP "candidate-distribution\$env:RELEASE_TAG-windows-x64.zip"
          $checksum = "$asset.sha256"
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf) -or
              -not (Test-Path -LiteralPath $checksum -PathType Leaf)) {
            throw 'Signed candidate asset or checksum is missing.'
          }
          $actual = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $record = (Get-Content -LiteralPath $checksum -Raw).Trim()
          if (-not $record.StartsWith($actual, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Candidate SHA-256 record does not match the signed asset.'
          }

      - name: Upload signed candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-v3-windows-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/candidate-distribution/${{ steps.metadata.outputs.release_tag }}-windows-x64.zip
            ${{ runner.temp }}/candidate-distribution/${{ steps.metadata.outputs.release_tag }}-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 3

  cleanup-preview-on-candidate-failure:
    if: always() && needs.edge-preview.result != 'skipped' && (needs.edge-preview.result != 'success' || needs.windows-signed-candidate.result != 'success')
    needs:
      - edge-preview
      - windows-signed-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: public-release
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Delete failed candidate Preview
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler preview delete \
            --cwd . \
            --config services/mcp-edge-gateway/wrangler.jsonc \
            --name r10-homologation \
            --worker-name mcp-access-stack \
            --skip-confirmation

      - name: Restore Worker Preview URL state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_DEV_ENABLED_BEFORE: ${{ needs.edge-preview.outputs.workers_dev_enabled_before }}
          PREVIEWS_ENABLED_BEFORE: ${{ needs.edge-preview.outputs.previews_enabled_before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$WORKERS_DEV_ENABLED_BEFORE" || -z "$PREVIEWS_ENABLED_BEFORE" ]]; then
            echo "No prior Worker subdomain state was captured; nothing was changed by this run."
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/mcp-access-stack/subdomain"
          payload="$(jq -n \
            --argjson enabled "$WORKERS_DEV_ENABLED_BEFORE" \
            --argjson previews "$PREVIEWS_ENABLED_BEFORE" \
            '{enabled:$enabled,previews_enabled:$previews}')"
          response="$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$api")"
          if [[ "$(jq -r '.success // false' <<<"$response")" != "true" ||
                "$(jq -r '.result.enabled // empty' <<<"$response")" != "$WORKERS_DEV_ENABLED_BEFORE" ||
                "$(jq -r '.result.previews_enabled // empty' <<<"$response")" != "$PREVIEWS_ENABLED_BEFORE" ]]; then
            echo "Failed to restore Worker Preview URL state." >&2
            exit 1
          fi

  cleanup-preview:
    if: startsWith(github.ref_name, 'candidate/cleanup-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: public-release
    steps:
      - name: Checkout exact cleanup commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Delete isolated R10 Preview
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler preview delete \
            --cwd . \
            --config services/mcp-edge-gateway/wrangler.jsonc \
            --name r10-homologation \
            --worker-name mcp-access-stack \
            --skip-confirmation

      - name: Restore Worker Preview URL state from cleanup tag
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            candidate/cleanup-p0-w0-*) previews=false; workers=false ;;
            candidate/cleanup-p0-w1-*) previews=false; workers=true ;;
            candidate/cleanup-p1-w0-*) previews=true; workers=false ;;
            candidate/cleanup-p1-w1-*) previews=true; workers=true ;;
            *)
              echo "Cleanup tag must encode prior state as candidate/cleanup-p{0|1}-w{0|1}-..." >&2
              exit 1
              ;;
          esac
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/mcp-access-stack/subdomain"
          payload="$(jq -n --argjson enabled "$workers" --argjson previews "$previews" '{enabled:$enabled,previews_enabled:$previews}')"
          response="$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$api")"
          if [[ "$(jq -r '.success // false' <<<"$response")" != "true" ||
                "$(jq -r '.result.enabled // empty' <<<"$response")" != "$workers" ||
                "$(jq -r '.result.previews_enabled // empty' <<<"$response")" != "$previews" ]]; then
            echo "Failed to restore Worker Preview URL state from cleanup tag." >&2
            exit 1
          fi
