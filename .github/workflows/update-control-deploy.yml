name: Update Control deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/update-control-deploy.yml
      - .github/workflows/update-control-oauth-reprovision.yml
      - tooling/update-control-oauth-reprovision.mjs
      - services/update-control-worker/**
      - packages/edge-protocol/**
      - packages/mcp-owner-auth/**
      - packages/update-control-contract/**
      - services/oracle-release-orchestrator/**
      - deploy/linux/mcp-v3-oracle-read-api.service
      - deploy/linux/mcp-v3-update-control-cloudflared.service
      - deploy/linux/Test-McpUpdateControlServices.mjs
      - docs/update-control-deployment.md
      - tooling/update-control-deploy-preflight.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Explicitly confirm deployment of the independent Update Control Worker."
        required: true
        type: choice
        default: "NO"
        options:
          - "NO"
          - "DEPLOY_UPDATE_CONTROL"

permissions:
  contents: read

concurrency:
  group: update-control-production
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check Update Control Worker (uses locked workspace Wrangler, dry-run only)
        run: npm run check:update-control
      - name: Test Update Control Worker and OAuth operator workflow
        run: npm run test:update-control-worker
      - name: Build and test Oracle read API
        run: npm run build --workspace @mcp-access-stack/oracle-release-orchestrator && npm run test:oracle-release-orchestrator
      - name: Validate Update Control runtime templates
        run: node deploy/linux/Test-McpUpdateControlServices.mjs
      - name: Verify systemd unit syntax
        run: systemd-analyze verify deploy/linux/mcp-v3-oracle-read-api.service deploy/linux/mcp-v3-update-control-cloudflared.service

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'DEPLOY_UPDATE_CONTROL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: update-control-production
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate all normal-deploy runtime settings without printing values
        shell: bash
        env:
          UPDATE_CONTROL_CF_API_TOKEN: ${{ secrets.UPDATE_CONTROL_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ORACLE_ACCESS_CLIENT_ID: ${{ vars.ORACLE_ACCESS_CLIENT_ID }}
          ORACLE_ACCESS_CLIENT_SECRET: ${{ secrets.ORACLE_ACCESS_CLIENT_SECRET }}
          UPDATE_CONTROL_ORCHESTRATOR_TOKEN: ${{ secrets.UPDATE_CONTROL_ORCHESTRATOR_TOKEN }}
          MCP_UPDATE_CONTROL_PUBLIC_URL: ${{ vars.MCP_UPDATE_CONTROL_PUBLIC_URL }}
          ORCHESTRATOR_READ_API_URL: ${{ vars.ORCHESTRATOR_READ_API_URL }}
          UPDATE_CONTROL_OAUTH_REPROVISION_URL: ${{ vars.UPDATE_CONTROL_OAUTH_REPROVISION_URL }}
          UPDATE_CONTROL_OAUTH_REPROVISION_ACCESS_ISSUER: ${{ vars.UPDATE_CONTROL_OAUTH_REPROVISION_ACCESS_ISSUER }}
          UPDATE_CONTROL_OAUTH_REPROVISION_ACCESS_AUDIENCE: ${{ vars.UPDATE_CONTROL_OAUTH_REPROVISION_ACCESS_AUDIENCE }}
        run: node tooling/update-control-deploy-preflight.mjs
      - name: Deploy only Update Control
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UPDATE_CONTROL_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MCP_UPDATE_CONTROL_PUBLIC_URL: ${{ vars.MCP_UPDATE_CONTROL_PUBLIC_URL }}
          ORACLE_ACCESS_CLIENT_ID: ${{ vars.ORACLE_ACCESS_CLIENT_ID }}
          ORCHESTRATOR_READ_API_URL: ${{ vars.ORCHESTRATOR_READ_API_URL }}
          UPDATE_CONTROL_OAUTH_REPROVISION_URL: ${{ vars.UPDATE_CONTROL_OAUTH_REPROVISION_URL }}
          UPDATE_CONTROL_OAUTH_REPROVISION_ACCESS_ISSUER: ${{ vars.UPDATE_CONTROL_OAUTH_REPROVISION_ACCESS_ISSUER }}
          UPDATE_CONTROL_OAUTH_REPROVISION_ACCESS_AUDIENCE: ${{ vars.UPDATE_CONTROL_OAUTH_REPROVISION_ACCESS_AUDIENCE }}
        run: |
          set -euo pipefail
          npm exec --offline --workspace @mcp-access-stack/update-control-worker -- wrangler deploy --cwd ../.. --config services/update-control-worker/wrangler.jsonc --var "MCP_UPDATE_CONTROL_OAUTH_REPROVISION_URL:$UPDATE_CONTROL_OAUTH_REPROVISION_URL" --var "MCP_UPDATE_CONTROL_OAUTH_REPROVISION_ACCESS_ISSUER:$UPDATE_CONTROL_OAUTH_REPROVISION_ACCESS_ISSUER" --var "MCP_UPDATE_CONTROL_OAUTH_REPROVISION_ACCESS_AUDIENCE:$UPDATE_CONTROL_OAUTH_REPROVISION_ACCESS_AUDIENCE" --var "MCP_UPDATE_CONTROL_PUBLIC_URL:$MCP_UPDATE_CONTROL_PUBLIC_URL" --var "ORACLE_ACCESS_CLIENT_ID:$ORACLE_ACCESS_CLIENT_ID" --var "ORCHESTRATOR_READ_API_URL:$ORCHESTRATOR_READ_API_URL"
      - name: Install Oracle read API runtime secrets through locked Wrangler stdin
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UPDATE_CONTROL_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ORACLE_ACCESS_CLIENT_SECRET: ${{ secrets.ORACLE_ACCESS_CLIENT_SECRET }}
          UPDATE_CONTROL_ORCHESTRATOR_TOKEN: ${{ secrets.UPDATE_CONTROL_ORCHESTRATOR_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$ORACLE_ACCESS_CLIENT_SECRET" | npm exec --offline --workspace @mcp-access-stack/update-control-worker -- wrangler secret put ORACLE_ACCESS_CLIENT_SECRET --cwd ../.. --config services/update-control-worker/wrangler.jsonc
          printf '%s' "$UPDATE_CONTROL_ORCHESTRATOR_TOKEN" | npm exec --offline --workspace @mcp-access-stack/update-control-worker -- wrangler secret put UPDATE_CONTROL_ORCHESTRATOR_TOKEN --cwd ../.. --config services/update-control-worker/wrangler.jsonc
