name: Update Control deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/update-control-deploy.yml
      - .github/workflows/update-control-oauth-reprovision.yml
      - tooling/update-control-oauth-reprovision.mjs
      - services/update-control-worker/**
      - packages/edge-protocol/**
      - packages/mcp-owner-auth/**
      - packages/update-control-contract/**
      - services/oracle-release-orchestrator/**
      - deploy/linux/mcp-v3-oracle-read-api.service
      - deploy/linux/mcp-v3-update-control-oracle-channel.service
      - deploy/linux/Test-McpUpdateControlServices.mjs
      - docs/update-control-deployment.md
      - tooling/update-control-deploy-preflight.mjs
      - tooling/update-control-oracle-runtime.mjs
      - tooling/update-control-oracle-runtime.test.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Explicitly confirm deployment of the independent Update Control Worker."
        required: true
        type: choice
        default: "NO"
        options:
          - "NO"
          - "DEPLOY_UPDATE_CONTROL"

permissions:
  contents: read

concurrency:
  group: update-control-production
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check Update Control Worker (uses locked workspace Wrangler, dry-run only)
        run: npm run check:update-control
      - name: Test Update Control Worker and OAuth operator workflow
        run: npm run test:update-control-worker
      - name: Build and test Oracle read API and runtime stager
        run: npm run test:update-control-oracle-runtime && npm run test:oracle-release-orchestrator
      - name: Validate Update Control runtime templates
        run: node deploy/linux/Test-McpUpdateControlServices.mjs
      - name: Verify systemd unit syntax
        run: systemd-analyze verify deploy/linux/mcp-v3-oracle-read-api.service deploy/linux/mcp-v3-update-control-oracle-channel.service

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'DEPLOY_UPDATE_CONTROL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: update-control-production
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate all normal-deploy runtime settings without printing values
        shell: bash
        env:
          UPDATE_CONTROL_CF_API_TOKEN: ${{ secrets.UPDATE_CONTROL_CF_API_TOKEN }}
          UPDATE_CONTROL_ORACLE_CHANNEL_TOKEN: ${{ secrets.UPDATE_CONTROL_ORACLE_CHANNEL_TOKEN }}
          UPDATE_CONTROL_OAUTH_REPROVISION_HMAC_KEY: ${{ secrets.UPDATE_CONTROL_OAUTH_REPROVISION_HMAC_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MCP_UPDATE_CONTROL_PUBLIC_URL: ${{ vars.MCP_UPDATE_CONTROL_PUBLIC_URL }}
        run: node tooling/update-control-deploy-preflight.mjs
      - name: Install Oracle WSS channel secret through locked Wrangler stdin
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UPDATE_CONTROL_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          UPDATE_CONTROL_ORACLE_CHANNEL_TOKEN: ${{ secrets.UPDATE_CONTROL_ORACLE_CHANNEL_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$UPDATE_CONTROL_ORACLE_CHANNEL_TOKEN" | npm exec --offline --workspace @mcp-access-stack/update-control-worker -- wrangler secret put UPDATE_CONTROL_ORACLE_CHANNEL_TOKEN --cwd ../.. --config services/update-control-worker/wrangler.jsonc
      - name: Install OAuth reprovision HMAC key through locked Wrangler stdin
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UPDATE_CONTROL_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          UPDATE_CONTROL_OAUTH_REPROVISION_HMAC_KEY: ${{ secrets.UPDATE_CONTROL_OAUTH_REPROVISION_HMAC_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$UPDATE_CONTROL_OAUTH_REPROVISION_HMAC_KEY" | npm exec --offline --workspace @mcp-access-stack/update-control-worker -- wrangler secret put UPDATE_CONTROL_OAUTH_REPROVISION_HMAC_KEY --cwd ../.. --config services/update-control-worker/wrangler.jsonc
      - name: Deploy only Update Control
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UPDATE_CONTROL_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MCP_UPDATE_CONTROL_PUBLIC_URL: ${{ vars.MCP_UPDATE_CONTROL_PUBLIC_URL }}
        run: |
          set -euo pipefail
          npm exec --offline --workspace @mcp-access-stack/update-control-worker -- wrangler deploy --cwd ../.. --config services/update-control-worker/wrangler.jsonc --var "MCP_UPDATE_CONTROL_PUBLIC_URL:$MCP_UPDATE_CONTROL_PUBLIC_URL"
