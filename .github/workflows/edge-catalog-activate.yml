name: Guarded Edge catalog-only publication

run-name: mcp-edge-catalog-${{ inputs.operation_id }}

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact main SHA with successful canonical CI
        required: true
        type: string
      stage_run_id:
        description: Successful Edge CAS immutable staging run ID for the catalog in tooling/release/edge-catalog-rollout.json
        required: true
        type: string
      expected_active_deployment_id:
        description: Fresh CAS pin for current active Cloudflare deployment
        required: true
        type: string
      expected_active_version_id:
        description: Fresh CAS pin for current 100 percent Worker version
        required: true
        type: string
      operation_id:
        description: Stable UUID identifying the one-shot Edge catalog operation
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: public-release-edge
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      staged_version_id: ${{ steps.stage.outputs.version_id }}
    steps:
      - name: Pin one main CI and independently successful staged version without credentials
        id: stage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          STAGE_RUN_ID: ${{ inputs.stage_run_id }}
          EXPECTED_ACTIVE_DEPLOYMENT_ID: ${{ inputs.expected_active_deployment_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ inputs.expected_active_version_id }}
          OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "iFael/mcp-access-stack" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$STAGE_RUN_ID" =~ ^[1-9][0-9]{4,20}$ ]]
          [[ "$OPERATION_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[1-8][a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$ ]]
          [[ "$EXPECTED_ACTIVE_DEPLOYMENT_ID" =~ ^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$ ]]
          [[ "$EXPECTED_ACTIVE_VERSION_ID" =~ ^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$ ]]
          [[ "$(gh api repos/iFael/mcp-access-stack/git/ref/heads/main --jq '.object.sha')" == "$EXPECTED_MAIN_SHA" ]]
          ci_count="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch main \
            --commit "$EXPECTED_MAIN_SHA" --event push --status success --limit 20 \
            --json headSha,status,conclusion --jq '[.[] | select(.headSha == env.EXPECTED_MAIN_SHA and .status == "completed" and .conclusion == "success")] | length')"
          [[ "$ci_count" =~ ^[1-9][0-9]*$ ]]

          # Never reuse this operationId across multiple dispatches, even after failure.
          existing="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow edge-catalog-activate.yml \
            --limit 100 --json databaseId,displayTitle \
            --jq '[.[] | select(.displayTitle == ("mcp-edge-catalog-" + env.OPERATION_ID))] | length')"
          [[ "$existing" == "1" ]]

          stage="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN_ID" \
            --jq '[.head_sha,.head_branch,.event,.status,.conclusion,.run_attempt,.path] | @tsv')"
          IFS=$'\t' read -r stage_sha stage_branch stage_event stage_status stage_conclusion stage_attempt stage_path <<< "$stage"
          # The staged Worker must be built from the exact main being activated.
          [[ "$stage_sha" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$stage_branch" == "main" && "$stage_event" == "workflow_dispatch" ]]
          [[ "$stage_status" == "completed" && "$stage_conclusion" == "success" && "$stage_attempt" == "1" ]]
          [[ "$stage_path" == ".github/workflows/edge-cas-candidate-stage.yml" ]]
          receipts="$(gh run view "$STAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log |
            grep -oE 'EDGE_CAS_STAGE_UPLOADED_NO_TRAFFIC version_id=[a-f0-9-]+' || true)"
          [[ "$(printf '%s\n' "$receipts" | grep -c '^EDGE_CAS_STAGE_UPLOADED_NO_TRAFFIC version_id=' || true)" == "1" ]]
          version_id="${receipts##*=}"
          [[ "$version_id" =~ ^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$ ]]
          [[ "$version_id" != "$EXPECTED_ACTIVE_VERSION_ID" ]]
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

  publish:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: public-release
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_main_sha }}
          persist-credentials: false
      - name: Set up Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - name: Reconcile immutable SHA and single operation after Environment approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$(gh api repos/iFael/mcp-access-stack/git/ref/heads/main --jq '.object.sha')" == "$EXPECTED_MAIN_SHA" ]]
          same="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow edge-catalog-activate.yml \
            --limit 100 --json databaseId,displayTitle \
            --jq '[.[] | select(.displayTitle == ("mcp-edge-catalog-" + env.OPERATION_ID))] | length')"
          [[ "$same" == "1" ]]
      - name: Install pinned dependencies and verify catalog release regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test tooling/release/activate-edge-catalog.test.mjs \
            tooling/release/stage-edge-cas-candidate.test.mjs
      - name: Read-only dual Cloudflare CAS and active contract health
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_ACTIVE_DEPLOYMENT_ID: ${{ inputs.expected_active_deployment_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ inputs.expected_active_version_id }}
          STAGED_VERSION_ID: ${{ needs.preflight.outputs.staged_version_id }}
          EDGE_CATALOG_STAGE_RUN_ID: ${{ inputs.stage_run_id }}
          EDGE_CATALOG_OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          set -euo pipefail
          node tooling/release/activate-edge-catalog.mjs preflight
      - name: ONE 100-percent Cloudflare deployment, no automatic retry
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_ACTIVE_DEPLOYMENT_ID: ${{ inputs.expected_active_deployment_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ inputs.expected_active_version_id }}
          STAGED_VERSION_ID: ${{ needs.preflight.outputs.staged_version_id }}
          EDGE_CATALOG_STAGE_RUN_ID: ${{ inputs.stage_run_id }}
          EDGE_CATALOG_OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          set -euo pipefail
          node tooling/release/activate-edge-catalog.mjs deploy
      - name: ONE authenticated candidate preparation after verified deployment
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MCP_CONTRACT_PREPARE_TOKEN: ${{ secrets.MCP_CONTRACT_PREPARE_TOKEN }}
          EXPECTED_ACTIVE_DEPLOYMENT_ID: ${{ inputs.expected_active_deployment_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ inputs.expected_active_version_id }}
          STAGED_VERSION_ID: ${{ needs.preflight.outputs.staged_version_id }}
          NEW_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          EDGE_CATALOG_STAGE_RUN_ID: ${{ inputs.stage_run_id }}
          EDGE_CATALOG_OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          set -euo pipefail
          node tooling/release/activate-edge-catalog.mjs prepare
